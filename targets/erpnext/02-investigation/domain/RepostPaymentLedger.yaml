    kind: many-to-one
    via: voucher_type
  - to: RepostPaymentLedgerItems
    kind: one-to-many
    via: repost_vouchers
    description: lines (Selected Vouchers)
  - to: RepostPaymentLedger
    kind: many-to-one
    via: amended_from
lifecycle:
  - draft
  - submitted
  - cancelled
storage:
  engine: Frappe (MariaDB)
  observed_table: tabRepost Payment Ledger
status: confirmed
