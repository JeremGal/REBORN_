name: RepostPaymentLedger
description: 'Rebuilds the payment ledger so outstanding amounts are right again. Document type "Repost Payment Ledger" (module Accounts): draft, submitted, cancelled life cycle.'
fields:
  - name: company
    label: Company
    type: ref
    observed_as: company
    required: true
    ref: Company
  - name: posting_date
    label: Posting Date
    type: date
    observed_as: posting_date
    required: true
    default: Today
  - name: voucher_type
    label: Voucher Type
    type: ref
    observed_as: voucher_type
    ref: DocType
  - name: add_manually
    label: Add Manually
    type: boolean
    observed_as: add_manually
    default: "0"
  - name: repost_status
    label: Repost Status
    type: enum
    observed_as: repost_status
    enum_values:
      - Queued
      - Failed
      - Completed
  - name: repost_error_log
    label: Repost Error Log
    type: text
    observed_as: repost_error_log
  - name: amended_from
    label: Amended From
    type: ref
    observed_as: amended_from
    ref: RepostPaymentLedger
relations:
  - to: Company
    kind: many-to-one
    via: company
