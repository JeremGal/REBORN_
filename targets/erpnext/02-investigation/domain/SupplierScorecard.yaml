name: SupplierScorecard
description: Rates a supplier over time on criteria you choose. Document type "Supplier Scorecard" (module Buying).
fields:
  - name: supplier
    label: Supplier
    type: ref
    observed_as: supplier
    unique: true
    ref: Supplier
  - name: supplier_score
    label: Supplier Score
    type: string
    observed_as: supplier_score
  - name: indicator_color
    label: Indicator Color
    type: string
    observed_as: indicator_color
  - name: status
    label: Status
    type: string
    observed_as: status
  - name: period
    label: Evaluation Period
    type: enum
    observed_as: period
    required: true
    enum_values:
      - Per Week
      - Per Month
      - Per Year
    default: Per Month
  - name: weighting_function
    label: Weighting Function
    type: text
    observed_as: weighting_function
    required: true
    default: "{total_score} * max( 0, min ( 1 , (12 - {period_number}) / 12) )"
  - name: warn_rfqs
    label: Warn for new Request for Quotations
    type: boolean
    observed_as: warn_rfqs
    default: "0"
  - name: warn_pos
    label: Warn for new Purchase Orders
    type: boolean
    observed_as: warn_pos
    default: "0"
  - name: prevent_rfqs
    label: Prevent RFQs
    type: boolean
    observed_as: prevent_rfqs
    default: "0"
  - name: prevent_pos
    label: Prevent POs
    type: boolean
    observed_as: prevent_pos
    default: "0"
  - name: notify_supplier
    label: Notify Supplier
    type: boolean
    observed_as: notify_supplier
    default: "0"
  - name: notify_employee
    label: Notify Employee
    type: boolean
    observed_as: notify_employee
    default: "0"
  - name: employee
    label: Employee
    type: ref
    observed_as: employee
    ref: Employee
relations:
  - to: Supplier
    kind: many-to-one
    via: supplier
  - to: SupplierScorecardScoringStanding
    kind: one-to-many
    via: standings
    description: lines (Scoring Standings)
  - to: SupplierScorecardScoringCriteria
    kind: one-to-many
    via: criteria
    description: lines (Scoring Criteria)
  - to: Employee
    kind: many-to-one
    via: employee
storage:
  engine: Frappe (MariaDB)
  observed_table: tabSupplier Scorecard
status: confirmed
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: definition of Supplier Scorecard
    note: declared by the program and served by its API
