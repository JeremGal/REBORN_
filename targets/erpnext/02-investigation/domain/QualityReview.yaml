name: QualityReview
description: A periodic check of how a quality goal is going. Document type "Quality Review" (module Quality Management).
fields:
  - name: goal
    label: Goal
    type: ref
    observed_as: goal
    required: true
    ref: QualityGoal
  - name: date
    label: Date
    type: date
    observed_as: date
    default: Today
  - name: procedure
    label: Procedure
    type: ref
    observed_as: procedure
    ref: QualityProcedure
  - name: status
    label: Status
    type: enum
    observed_as: status
    enum_values:
      - Open
      - Passed
      - Failed
    default: Open
  - name: additional_information
    label: Additional Information
    type: text
    observed_as: additional_information
relations:
  - to: QualityGoal
    kind: many-to-one
    via: goal
  - to: QualityProcedure
    kind: many-to-one
    via: procedure
  - to: QualityReviewObjective
    kind: one-to-many
    via: reviews
    description: lines (Reviews)
storage:
  engine: Frappe (MariaDB)
  observed_table: tabQuality Review
status: confirmed
evidence:
  - ref: rb_8c499662e4b337ccdf0b1c0daf2a475eb783203bf872fb96553bf7f678f8e871
    kind: rea
    locator: definition of Quality Review
    note: declared by the program and served by its API
