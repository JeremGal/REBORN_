    type: text
    observed_as: main_section_md
  - name: main_section_html
    label: Main Section (HTML)
    type: text
    observed_as: main_section_html
  - name: context_script
    label: Context Script
    type: text
    observed_as: context_script
  - name: javascript
    label: Javascript
    type: text
    observed_as: javascript
  - name: insert_style
    label: Insert Style
    type: boolean
    observed_as: insert_style
    default: "0"
  - name: text_align
    label: Text Align
    type: enum
    observed_as: text_align
    enum_values:
      - Left
      - Center
      - Right
  - name: css
    label: CSS
    type: text
    observed_as: css
  - name: full_width
    label: Full Width
    type: boolean
    observed_as: full_width
    default: "1"
  - name: show_title
    label: Show Title
    type: boolean
    observed_as: show_title
    default: "0"
  - name: start_date
