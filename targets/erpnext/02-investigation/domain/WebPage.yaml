    observed_as: title
    required: true
  - name: route
    label: Route
    type: string
    observed_as: route
    unique: true
  - name: dynamic_route
    label: Dynamic Route
    type: boolean
    observed_as: dynamic_route
    default: "0"
  - name: published
    label: Published
    type: boolean
    observed_as: published
    default: "1"
  - name: module
