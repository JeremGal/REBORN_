  - name: outstanding
    label: Outstanding
    type: money
    observed_as: outstanding
  - name: paid_amount
    label: Paid Amount
    type: money
    observed_as: paid_amount
  - name: discounted_amount
    label: Discounted Amount
    type: money
    observed_as: discounted_amount
    default: "0"
  - name: base_payment_amount
    label: Payment Amount (Company Currency)
    type: money
    observed_as: base_payment_amount
