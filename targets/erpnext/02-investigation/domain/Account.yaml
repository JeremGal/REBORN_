      - Fixed Asset
      - Income Account
      - Indirect Expense
      - Indirect Income
      - Liability
      - Payable
      - Receivable
      - Round Off
      - Round Off for Opening
      - Stock
      - Stock Adjustment
      - Stock Received But Not Billed
      - Service Received But Not Billed
      - Tax
      - Temporary
