    label: Disable
    type: boolean
    observed_as: disabled
    default: "0"
  - name: account_name
    label: Account Name
    type: string
    observed_as: account_name
    required: true
  - name: account_number
    label: Account Number
    type: string
    observed_as: account_number
  - name: is_group
