fields:
  - name: company
    label: Company
    type: ref
    observed_as: company
    required: true
    ref: Company
  - name: posting_date
    label: Posting Date
    type: date
    observed_as: posting_date
    required: true
  - name: posting_time
    label: Posting Time
    type: time
    observed_as: posting_time
    required: true
  - name: merge_invoices_based_on
    label: Merge Invoices Based On
    type: enum
    observed_as: merge_invoices_based_on
    required: true
    enum_values:
      - Customer
      - Customer Group
  - name: pos_closing_entry
    label: POS Closing Entry
    type: ref
    observed_as: pos_closing_entry
    ref: POSClosingEntry
  - name: customer
    label: Customer
    type: ref
    observed_as: customer
    required: true
    ref: Customer
  - name: customer_group
    label: Customer Group
    type: ref
    observed_as: customer_group
    ref: CustomerGroup
  - name: consolidated_invoice
