relations:
  - to: Company
    kind: many-to-one
    via: company
  - to: Item
    kind: many-to-one
    via: production_item
  - to: BOM
    kind: many-to-one
    via: bom_no
  - to: SalesOrder
    kind: many-to-one
    via: sales_order
  - to: Warehouse
    kind: many-to-one
    via: wip_warehouse
  - to: Warehouse
    kind: many-to-one
    via: fg_warehouse
  - to: Warehouse
    kind: many-to-one
    via: scrap_warehouse
  - to: WorkOrderOperation
    kind: one-to-many
    via: operations
    description: lines (Operations)
  - to: Warehouse
    kind: many-to-one
    via: source_warehouse
  - to: WorkOrderItem
    kind: one-to-many
    via: required_items
    description: lines (required_items)
  - to: UOM
    kind: many-to-one
    via: stock_uom
  - to: WorkOrderAdditionalItem
    kind: one-to-many
    via: non_stock_items
    description: lines (Additional Costs (as per BOM))
  - to: WorkOrderAdditionalItem
    kind: one-to-many
    via: secondary_items
    description: lines (Secondary Items (as per BOM))
  - to: Project
    kind: many-to-one
    via: project
  - to: SubcontractingInwardOrder
    kind: many-to-one
    via: subcontracting_inward_order
  - to: ProductionPlan
    kind: many-to-one
    via: production_plan
  - to: MasterProductionSchedule
    kind: many-to-one
    via: mps
  - to: MaterialRequest
    kind: many-to-one
    via: material_request
  - to: Item
    kind: many-to-one
    via: product_bundle_item
  - to: WorkOrder
    kind: many-to-one
    via: amended_from
lifecycle:
  - draft
  - submitted
  - cancelled
storage:
  engine: Frappe (MariaDB)
  observed_table: tabWork Order
status: confirmed
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
