    type: money
    observed_as: expected_value_after_useful_life
  - name: value_after_depreciation
    label: Value After Depreciation
    type: money
    observed_as: value_after_depreciation
  - name: notes
    label: Notes
    type: text
    observed_as: notes
  - name: status
    label: Status
    type: enum
    observed_as: status
    enum_values:
      - Draft
      - Active
      - Cancelled
  - name: amended_from
    label: Amended From
    type: ref
    observed_as: amended_from
    ref: AssetDepreciationSchedule
relations:
