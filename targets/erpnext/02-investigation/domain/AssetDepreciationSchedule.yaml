name: AssetDepreciationSchedule
description: 'When an asset depreciates, and by how much. Document type "Asset Depreciation Schedule" (module Assets): draft, submitted, cancelled life cycle.'
fields:
  - name: asset
    label: Asset
    type: ref
    observed_as: asset
    required: true
    ref: Asset
  - name: naming_series
    label: Naming Series
    type: enum
    observed_as: naming_series
    enum_values:
      - ACC-ADS-.YYYY.-
  - name: company
    label: Company
    type: ref
    observed_as: company
    ref: Company
  - name: net_purchase_amount
    label: Net Purchase Amount
    type: money
    observed_as: net_purchase_amount
  - name: opening_accumulated_depreciation
    label: Opening Accumulated Depreciation
    type: money
    observed_as: opening_accumulated_depreciation
  - name: opening_number_of_booked_depreciations
    label: Opening Number of Booked Depreciations
    type: integer
    observed_as: opening_number_of_booked_depreciations
  - name: finance_book
    label: Finance Book
    type: ref
    observed_as: finance_book
    ref: FinanceBook
  - name: finance_book_id
    label: Finance Book Id
    type: integer
    observed_as: finance_book_id
  - name: depreciation_method
    label: Depreciation Method
    type: enum
    observed_as: depreciation_method
    enum_values:
      - Straight Line
      - Double Declining Balance
      - Written Down Value
      - Manual
  - name: total_number_of_depreciations
    label: Total Number of Depreciations
    type: integer
    observed_as: total_number_of_depreciations
  - name: rate_of_depreciation
