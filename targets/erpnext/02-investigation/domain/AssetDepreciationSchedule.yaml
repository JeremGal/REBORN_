  - name: shift_based
    label: Depreciate based on shifts
    type: boolean
    observed_as: shift_based
    default: "0"
  - name: frequency_of_depreciation
    label: Frequency of Depreciation (Months)
    type: integer
    observed_as: frequency_of_depreciation
  - name: expected_value_after_useful_life
