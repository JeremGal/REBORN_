name: POSOpeningEntry
description: 'Opens a POS shift with the cash in the drawer. Document type "POS Opening Entry" (module Accounts): draft, submitted, cancelled life cycle.'
fields:
  - name: period_start_date
    label: Period Start Date
    type: datetime
    observed_as: period_start_date
    required: true
  - name: period_end_date
    label: Period End Date
    type: date
    observed_as: period_end_date
  - name: status
    label: Status
    type: enum
    observed_as: status
    enum_values:
      - Draft
      - Open
      - Closed
      - Cancelled
    default: Draft
  - name: posting_date
    label: Posting Date
    type: date
    observed_as: posting_date
    required: true
    default: Today
  - name: set_posting_date
    label: Set Posting Date
    type: boolean
    observed_as: set_posting_date
    default: "0"
  - name: company
    label: Company
    type: ref
    observed_as: company
    required: true
    ref: Company
  - name: pos_profile
    label: POS Profile
    type: ref
    observed_as: pos_profile
    required: true
    ref: POSProfile
  - name: pos_closing_entry
    label: POS Closing Entry
    type: string
    observed_as: pos_closing_entry
  - name: user
    label: Cashier
    type: ref
    observed_as: user
    required: true
    ref: User
  - name: amended_from
    label: Amended From
    type: ref
    observed_as: amended_from
    ref: POSOpeningEntry
relations:
  - to: Company
    kind: many-to-one
    via: company
  - to: POSProfile
    kind: many-to-one
    via: pos_profile
  - to: User
    kind: many-to-one
    via: user
  - to: POSOpeningEntryDetail
    kind: one-to-many
    via: balance_details
    description: lines (Opening Balance Details)
  - to: POSOpeningEntry
    kind: many-to-one
    via: amended_from
lifecycle:
  - draft
  - submitted
  - cancelled
storage:
  engine: Frappe (MariaDB)
  observed_table: tabPOS Opening Entry
status: confirmed
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: definition of POS Opening Entry
