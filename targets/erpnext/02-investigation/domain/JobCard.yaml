    type: ref
    observed_as: work_order
    required: true
    ref: WorkOrder
  - name: operation
    label: Operation
    type: ref
    observed_as: operation
    required: true
    ref: Operation
  - name: for_quantity
    label: Qty to Manufacture
    type: decimal
    observed_as: for_quantity
  - name: workstation
    label: Workstation
    type: ref
    observed_as: workstation
    required: true
    ref: Workstation
  - name: stock_uom
    label: Stock UOM
    type: ref
    observed_as: stock_uom
