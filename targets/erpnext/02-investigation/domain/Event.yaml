    kind: many-to-one
    via: google_calendar
  - to: EventParticipants
    kind: one-to-many
    via: event_participants
    description: lines (Event Participants)
  - to: DocType
    kind: many-to-one
    via: reference_doctype
  - to: DynamicLink
    kind: one-to-many
    via: links
    description: lines (Links)
  - to: EventNotifications
    kind: one-to-many
    via: notifications
    description: lines (Notifications)
storage:
