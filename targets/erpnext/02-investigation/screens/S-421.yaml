id: S-421
title: Stock Reservation Entry
purpose: create, view and edit Stock Reservation Entry records
kind: form
layout: "tabs: Serial and Batch Reservation, More Information; sections: Transaction Information, Item Information; 23 fields"
fields:
  - label: Voucher Type
    control: select
    binds: StockReservationEntry.voucher_type
    validation: read only (computed or filled by the program)
  - label: Voucher No
    control: lookup
    binds: StockReservationEntry.voucher_no
    validation: read only (computed or filled by the program)
  - label: Voucher Detail No
    control: text
    binds: StockReservationEntry.voucher_detail_no
    validation: read only (computed or filled by the program)
  - label: Voucher Qty
    control: number
    binds: StockReservationEntry.voucher_qty
    validation: read only (computed or filled by the program)
  - label: Available Qty to Reserve
    control: number
    binds: StockReservationEntry.available_qty
    validation: read only (computed or filled by the program)
  - label: Reserved Qty
    control: number
    binds: StockReservationEntry.reserved_qty
    validation: read only (computed or filled by the program)
  - label: Delivered Qty
    control: number
    binds: StockReservationEntry.delivered_qty
    validation: read only (computed or filled by the program)
  - label: Item Code
    control: lookup
    binds: StockReservationEntry.item_code
    validation: read only (computed or filled by the program); chosen among Item records
  - label: Warehouse
    control: lookup
    binds: StockReservationEntry.warehouse
    validation: read only (computed or filled by the program); chosen among Warehouse records
  - label: Stock UOM
    control: lookup
    binds: StockReservationEntry.stock_uom
    validation: read only (computed or filled by the program); chosen among UOM records
  - label: Has Serial No
    control: checkbox
    binds: StockReservationEntry.has_serial_no
    validation: "read only (computed or filled by the program); shown only when eval: doc.has_serial_no"
  - label: Has Batch No
    control: checkbox
    binds: StockReservationEntry.has_batch_no
    validation: "read only (computed or filled by the program); shown only when eval: doc.has_batch_no"
  - label: From Voucher Type
    control: select
    binds: StockReservationEntry.from_voucher_type
    validation: read only (computed or filled by the program)
  - label: From Voucher No
    control: lookup
    binds: StockReservationEntry.from_voucher_no
    validation: read only (computed or filled by the program)
  - label: From Voucher Detail No
    control: text
    binds: StockReservationEntry.from_voucher_detail_no
    validation: read only (computed or filled by the program)
  - label: Transferred Qty
    control: number
    binds: StockReservationEntry.transferred_qty
  - label: Consumed Qty
    control: number
    binds: StockReservationEntry.consumed_qty
  - label: Reservation Based On
    control: select
    binds: StockReservationEntry.reservation_based_on
    validation: "read only (computed or filled by the program); shown only when eval: parent.has_serial_no || parent.has_batch_no"
  - label: sb_entries
    control: grid
    validation: 'shown only when eval: (doc.has_serial_no || doc.has_batch_no) && doc.reservation_based_on == "Se'
    columns:
      - Serial No
      - Batch No
      - Qty
      - Warehouse
  - label: Company
    control: lookup
    binds: StockReservationEntry.company
    validation: read only (computed or filled by the program); chosen among Company records
  - label: Project
    control: lookup
    binds: StockReservationEntry.project
    validation: read only (computed or filled by the program); chosen among Project records
  - label: Status
    control: select
    binds: StockReservationEntry.status
    validation: read only (computed or filled by the program)
  - label: Amended From
    control: lookup
    binds: StockReservationEntry.amended_from
    validation: read only (computed or filled by the program); chosen among Stock Reservation Entry records
actions:
  - label: Save
    triggers: F-422
  - label: Submit
    triggers: F-422
  - label: Cancel
    triggers: F-422
  - label: Amend
    triggers: F-422
status: partial
