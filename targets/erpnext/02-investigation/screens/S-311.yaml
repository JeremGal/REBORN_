      - Operating Component
      - Operating Cost
  - label: Net Hour Rate
    control: money
    binds: WorkstationType.hour_rate
    validation: read only (computed or filled by the program)
  - label: Description
    control: text
    binds: WorkstationType.description
actions:
  - label: Save
    triggers: F-312
status: partial
