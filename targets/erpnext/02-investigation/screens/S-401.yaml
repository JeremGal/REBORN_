id: S-401
title: Price List
purpose: create, view and edit Price List records
kind: form
layout: 7 fields
fields:
  - label: Enabled
    control: checkbox
    binds: PriceList.enabled
  - label: Price List Name
    control: text
    binds: PriceList.price_list_name
    required: true
  - label: Currency
    control: lookup
    binds: PriceList.currency
    required: true
    validation: chosen among Currency records
  - label: Buying
    control: checkbox
    binds: PriceList.buying
  - label: Selling
    control: checkbox
    binds: PriceList.selling
  - label: Price Not UOM Dependent
    control: checkbox
    binds: PriceList.price_not_uom_dependent
  - label: Applicable for Countries
    control: grid
    columns:
      - Country
actions:
  - label: Save
    triggers: F-402
