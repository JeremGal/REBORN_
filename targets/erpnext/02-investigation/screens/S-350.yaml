id: S-350
title: Sales Order
purpose: create, view and edit Sales Order records
kind: form
layout: "tabs: Address & Contact, Terms, More Info, Proforma, Connections; sections: Accounting Dimensions, Currency and Price List, Items, Taxes, Totals, Totals (Company Currency), Additional Discount, Tax Breakup, Packing List, Pricing Rules, Billing Address, Shipping Address, Company Address, Payment Terms, Terms & Conditions, Status, Commission, Sales Team, Loyalty Points, Auto Repeat, Print Settings, UTM Analytics, Additional Info; 112 fields; observed labels differ from the declared form (19/32 match; not declared: no., code de l'article, quantité, prix usd, montant usd, total usd, type, compte compt...)"
fields:
