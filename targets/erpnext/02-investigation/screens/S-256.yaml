id: S-256
title: Code List
purpose: create, view and edit Code List records
kind: form
layout: 8 fields
fields:
  - label: Title
    control: text
    binds: CodeList.title
  - label: Canonical URI
    control: text
    binds: CodeList.canonical_uri
  - label: URL
    control: text
    binds: CodeList.url
  - label: Default Common Code
    control: lookup
    binds: CodeList.default_common_code
    validation: chosen among Common Code records
  - label: Version
    control: text
    binds: CodeList.version
  - label: Publisher
    control: text
    binds: CodeList.publisher
  - label: Publisher ID
    control: text
    binds: CodeList.publisher_id
  - label: Description
    control: text
    binds: CodeList.description
actions:
  - label: Save
    triggers: F-257
status: partial
