id: S-237
title: List Filter
purpose: create, view and edit List Filter records
kind: form
layout: "sections: Filters, Columns; 11 fields"
fields:
  - label: Filter Name
    control: text
    binds: ListFilter.filter_name
  - label: Reference Document Type
    control: lookup
    binds: ListFilter.reference_doctype
    validation: chosen among DocType records
  - label: Is Standard
    control: checkbox
    binds: ListFilter.is_standard
  - label: Module
    control: lookup
    binds: ListFilter.module
    validation: "shown only when eval: doc.is_standard; chosen among Module Def records"
  - label: Layout Order
    control: number
    binds: ListFilter.layout_order
  - label: Sort Field
    control: text
    binds: ListFilter.sort_field
  - label: Sort Order
    control: text
    binds: ListFilter.sort_order
  - label: For User
    control: lookup
    binds: ListFilter.for_user
    validation: chosen among User records
  - label: Route Signature
    control: text
    binds: ListFilter.route_signature
    validation: read only (computed or filled by the program)
  - label: Filters
    control: text
    binds: ListFilter.filters
  - label: Columns
    control: text
    binds: ListFilter.columns
actions:
  - label: Save
    triggers: F-238
status: partial
