id: S-180
title: Scheduled Job Log
purpose: create, view and edit Scheduled Job Log records
kind: form
layout: 4 fields
fields:
  - label: Status
    control: select
    binds: ScheduledJobLog.status
    required: true
    validation: read only (computed or filled by the program)
  - label: Scheduled Job
    control: lookup
    binds: ScheduledJobLog.scheduled_job_type
