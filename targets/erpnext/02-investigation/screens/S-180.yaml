    validation: read only (computed or filled by the program); chosen among Scheduled Job Type records
  - label: Details
    control: text
    binds: ScheduledJobLog.details
    validation: read only (computed or filled by the program)
  - label: Debug Log
    control: text
    binds: ScheduledJobLog.debug_log
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-181
status: partial
