  - label: Service End Date
    control: date
    binds: ProcessDeferredAccounting.end_date
    required: true
  - label: Amended From
    control: lookup
    binds: ProcessDeferredAccounting.amended_from
    validation: read only (computed or filled by the program); chosen among Process Deferred Accounting records
