id: S-076
title: Purchase Taxes and Charges Template
purpose: create, view and edit Purchase Taxes and Charges Template records
kind: form
layout: 6 fields
fields:
  - label: Title
    control: text
    binds: PurchaseTaxesAndChargesTemplate.title
    required: true
  - label: Default
    control: checkbox
    binds: PurchaseTaxesAndChargesTemplate.is_default
  - label: Disabled
    control: checkbox
    binds: PurchaseTaxesAndChargesTemplate.disabled
  - label: Company
    control: lookup
    binds: PurchaseTaxesAndChargesTemplate.company
    required: true
    validation: chosen among Company records
  - label: Tax Category
    control: lookup
    binds: PurchaseTaxesAndChargesTemplate.tax_category
    validation: chosen among Tax Category records
  - label: Purchase Taxes and Charges
    control: grid
    columns:
      - Type
      - Account Head
      - Tax Rate
      - Net Amount
      - Amount
      - Total
actions:
