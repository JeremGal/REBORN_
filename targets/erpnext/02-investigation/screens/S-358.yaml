id: S-358
title: Company
purpose: create, view and edit Company records
kind: form
layout: "tabs: Accounts, Accounts Closing, Buying and Selling, Stock and Manufacturing, Dashboard; sections: Address & Contact, Chart of Accounts, Default Accounts, Exchange Gain / Loss, Round Off, Deferred Accounting, Advance Payments, Exchange Rate Revaluation Settings, Budget Detail, Fixed Asset Defaults, Buying & Selling Settings, Purchase Expense, Stock Expense, Stock Settings, Manufacturing, Warehouse Defaults; 94 fields"
