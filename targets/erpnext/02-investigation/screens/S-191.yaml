id: S-191
title: Translation
purpose: create, view and edit Translation records
kind: form
layout: 7 fields
fields:
  - label: Contributed
    control: checkbox
    binds: Translation.contributed
    validation: read only (computed or filled by the program)
  - label: Language
    control: lookup
    binds: Translation.language
    required: true
    validation: chosen among Language records
  - label: Source Text
    control: text
    binds: Translation.source_text
    required: true
  - label: Context
    control: text
    binds: Translation.context
  - label: Translated Text
    control: text
    binds: Translation.translated_text
    required: true
  - label: Contribution Status
    control: select
    binds: Translation.contribution_status
    validation: read only (computed or filled by the program); shown only when doc.contributed
  - label: Contribution Document Name
    control: text
    binds: Translation.contribution_docname
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-192
status: partial
