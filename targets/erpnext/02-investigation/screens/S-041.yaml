id: S-041
title: Journal Entry Template
purpose: create, view and edit Journal Entry Template records
kind: form
layout: 7 fields
fields:
  - label: Template Title
    control: text
    binds: JournalEntryTemplate.template_title
    required: true
  - label: Journal Entry Type
    control: select
    binds: JournalEntryTemplate.voucher_type
    required: true
  - label: Series
    control: select
    binds: JournalEntryTemplate.naming_series
    required: true
  - label: Company
    control: lookup
    binds: JournalEntryTemplate.company
    required: true
    validation: chosen among Company records
  - label: Is Opening
    control: select
    binds: JournalEntryTemplate.is_opening
  - label: Multi Currency
    control: checkbox
    binds: JournalEntryTemplate.multi_currency
  - label: Accounting Entries
    control: grid
    columns:
      - Account
      - Party Type
      - Party
actions:
  - label: Save
    triggers: F-042
status: partial
