    control: checkbox
    binds: POSProfile.disabled
  - label: Warehouse
    control: lookup
    binds: POSProfile.warehouse
    required: true
    validation: shown only when update_stock; chosen among Warehouse records
  - label: Company Address
    control: lookup
    binds: POSProfile.company_address
    validation: chosen among Address records
  - label: Payment Methods
    control: grid
    required: true
    columns:
      - Default
      - Allow In Returns
      - Mode of Payment
  - label: Set Grand Total to Default Payment Method
    control: checkbox
    binds: POSProfile.set_grand_total_to_default_mop
  - label: Currency
    control: lookup
    binds: POSProfile.currency
    required: true
    validation: chosen among Currency records
