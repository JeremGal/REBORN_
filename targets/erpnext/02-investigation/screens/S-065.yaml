    control: lookup
    binds: POSProfile.income_account
    validation: chosen among Account records
  - label: Expense Account
    control: lookup
    binds: POSProfile.expense_account
    validation: chosen among Account records
  - label: Taxes and Charges
    control: lookup
    binds: POSProfile.taxes_and_charges
    validation: chosen among Sales Taxes and Charges Template records
  - label: Tax Category
    control: lookup
    binds: POSProfile.tax_category
    validation: chosen among Tax Category records
  - label: Account for Change Amount
    control: lookup
    binds: POSProfile.account_for_change_amount
    validation: chosen among Account records
