id: S-065
title: POS Profile
purpose: create, view and edit POS Profile records
kind: form
layout: "tabs: Accounting, POS Configurations, More Info; sections: Payment Methods, Price List & Currency, Write Off, Income and Expense, Taxes, Miscellaneous, Accounting Dimensions, POS Item Selector, POS Item Details, Applicable for Users, Filters, Print Settings, Campaign; 43 fields"
fields:
