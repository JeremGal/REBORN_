id: S-036
title: Fiscal Year
purpose: create, view and edit Fiscal Year records
kind: form
layout: 7 fields
fields:
  - label: Year Name
    control: text
    binds: FiscalYear.year
    required: true
  - label: Disabled
    control: checkbox
    binds: FiscalYear.disabled
  - label: Is Short/Long Year
    control: checkbox
    binds: FiscalYear.is_short_year
  - label: Year Start Date
    control: date
    binds: FiscalYear.year_start_date
    required: true
  - label: Year End Date
    control: date
    binds: FiscalYear.year_end_date
    required: true
  - label: Companies
    control: grid
    columns:
      - Company
  - label: Auto Created
    control: checkbox
    binds: FiscalYear.auto_created
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-037
status: partial
