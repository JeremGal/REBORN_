id: S-017
title: Bank Statement Import
purpose: create, view and edit Bank Statement Import records
kind: form
layout: "sections: Import File Errors and Warnings, Preview, Import Log; 17 fields"
fields:
  - label: Company
    control: lookup
    binds: BankStatementImport.company
    required: true
    validation: chosen among Company records
  - label: Bank Account
    control: lookup
    binds: BankStatementImport.bank_account
    required: true
    validation: chosen among Bank Account records
  - label: Bank
    control: lookup
    binds: BankStatementImport.bank
    validation: read only (computed or filled by the program); shown only when eval:doc.bank_account; chosen among Bank records
  - label: Import MT940 Fromat
    control: checkbox
    binds: BankStatementImport.import_mt940_fromat
  - label: Custom delimiters
    control: checkbox
    binds: BankStatementImport.custom_delimiters
  - label: Delimiter options
    control: text
    binds: BankStatementImport.delimiter_options
    validation: shown only when custom_delimiters
  - label: Import from Google Sheets
    control: text
    binds: BankStatementImport.google_sheets_url
    validation: |
      shown only when eval:!doc.__islocal && !doc.import_file
  - label: Import File
    control: other
    binds: BankStatementImport.import_file
    validation: shown only when eval:!doc.__islocal
  - label: Status
    control: select
    binds: BankStatementImport.status
    validation: read only (computed or filled by the program)
  - label: Template Options
    control: text
    binds: BankStatementImport.template_options
    validation: read only (computed or filled by the program)
  - label: Use CSV Sniffer
    control: checkbox
    binds: BankStatementImport.use_csv_sniffer
  - label: Template Warnings
    control: text
    binds: BankStatementImport.template_warnings
  - label: Show Failed Logs
    control: checkbox
    binds: BankStatementImport.show_failed_logs
  - label: Document Type
    control: lookup
    binds: BankStatementImport.reference_doctype
    required: true
    validation: chosen among DocType records
  - label: Import Type
    control: select
    binds: BankStatementImport.import_type
    required: true
  - label: Submit After Import
    control: checkbox
    binds: BankStatementImport.submit_after_import
  - label: Don't Send Emails
    control: checkbox
    binds: BankStatementImport.mute_emails
actions:
  - label: Save
    triggers: F-018
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Bank Statement Import
    note: declared by the program
