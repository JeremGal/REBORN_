id: S-139
title: Comment
purpose: create, view and edit Comment records
kind: form
layout: 11 fields
fields:
  - label: Comment Type
    control: select
    binds: Comment.comment_type
    required: true
  - label: Comment Email
    control: text
    binds: Comment.comment_email
  - label: Subject
    control: text
    binds: Comment.subject
  - label: Comment By
    control: text
    binds: Comment.comment_by
  - label: Published
    control: checkbox
    binds: Comment.published
  - label: Seen
    control: checkbox
    binds: Comment.seen
  - label: Reference Document Type
    control: lookup
    binds: Comment.reference_doctype
    validation: chosen among DocType records
  - label: Reference Name
    control: lookup
    binds: Comment.reference_name
  - label: Reference Owner
    control: text
    binds: Comment.reference_owner
    validation: read only (computed or filled by the program)
  - label: Content
    control: other
    binds: Comment.content
  - label: IP Address
    control: text
    binds: Comment.ip_address
actions:
  - label: Save
    triggers: F-140
status: partial
