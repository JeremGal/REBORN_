id: S-316
title: Print Format Snippet
purpose: create, view and edit Print Format Snippet records
kind: form
layout: 5 fields
fields:
  - label: Snippet Type
    control: select
    binds: PrintFormatSnippet.snippet_type
    required: true
  - label: Document Type
    control: lookup
    binds: PrintFormatSnippet.document_type
    validation: chosen among DocType records
  - label: Standard
    control: checkbox
    binds: PrintFormatSnippet.standard
    validation: shown only when eval:frappe.boot.developer_mode
  - label: Module
    control: lookup
    binds: PrintFormatSnippet.module
    validation: shown only when eval:doc.standard; chosen among Module Def records
  - label: Content
    control: text
    binds: PrintFormatSnippet.content
    required: true
actions:
  - label: Save
    triggers: F-317
status: partial
