  - label: Merge Invoices Based On
    control: select
    binds: POSInvoiceMergeLog.merge_invoices_based_on
    required: true
  - label: POS Closing Entry
    control: lookup
    binds: POSInvoiceMergeLog.pos_closing_entry
    validation: chosen among POS Closing Entry records
  - label: Customer
    control: lookup
    binds: POSInvoiceMergeLog.customer
    required: true
    validation: chosen among Customer records
  - label: Customer Group
    control: lookup
    binds: POSInvoiceMergeLog.customer_group
    validation: shown only when eval:doc.merge_invoices_based_on == 'Customer Group'; chosen among Customer Group records
  - label: POS Invoices
    control: grid
    required: true
    columns:
      - POS Invoice
      - Date
      - Amount
  - label: Consolidated Sales Invoice
    control: lookup
    binds: POSInvoiceMergeLog.consolidated_invoice
    validation: read only (computed or filled by the program); chosen among Sales Invoice records
  - label: Consolidated Credit Note
    control: lookup
    binds: POSInvoiceMergeLog.consolidated_credit_note
