id: S-063
title: POS Invoice Merge Log
purpose: create, view and edit POS Invoice Merge Log records
kind: form
layout: "sections: References; 11 fields; observed labels differ from the declared form (1/2 match; not declared: société, date de comptabilisation, heure de publication, fusionner les factures , inscription de clôture pdv, client)"
fields:
  - label: Company
    control: lookup
    binds: POSInvoiceMergeLog.company
