      - Tax Rate
      - Net Amount
      - Amount
      - Total
  - label: Taxes and Charges Added (Company Currency)
    control: money
    binds: PurchaseInvoice.base_taxes_and_charges_added
    validation: read only (computed or filled by the program)
  - label: Taxes and Charges Deducted (Company Currency)
    control: money
    binds: PurchaseInvoice.base_taxes_and_charges_deducted
    validation: read only (computed or filled by the program)
  - label: Total Taxes and Charges (Company Currency)
    control: money
    binds: PurchaseInvoice.base_total_taxes_and_charges
    validation: read only (computed or filled by the program)
  - label: Taxes and Charges Added
    control: money
    binds: PurchaseInvoice.taxes_and_charges_added
    validation: read only (computed or filled by the program)
  - label: Taxes and Charges Deducted
    control: money
    binds: PurchaseInvoice.taxes_and_charges_deducted
    validation: read only (computed or filled by the program)
  - label: Total Taxes and Charges
    control: money
    binds: PurchaseInvoice.total_taxes_and_charges
    validation: read only (computed or filled by the program)
  - label: Use Company Default Round Off Cost Center
    control: checkbox
    binds: PurchaseInvoice.use_company_roundoff_cost_center
  - label: Grand Total
    control: money
    binds: PurchaseInvoice.grand_total
    validation: read only (computed or filled by the program)
  - label: In Words
    control: text
    binds: PurchaseInvoice.in_words
    validation: read only (computed or filled by the program)
  - label: Disable Rounded Total
    control: checkbox
    binds: PurchaseInvoice.disable_rounded_total
    validation: shown only when grand_total
  - label: Rounding Adjustment
    control: money
    binds: PurchaseInvoice.rounding_adjustment
    validation: read only (computed or filled by the program); shown only when eval:!doc.disable_rounded_total
  - label: Rounded Total
    control: money
    binds: PurchaseInvoice.rounded_total
    validation: read only (computed or filled by the program); shown only when eval:!doc.disable_rounded_total
  - label: Grand Total
    control: money
    binds: PurchaseInvoice.base_grand_total
    validation: read only (computed or filled by the program)
  - label: In Words
    control: text
    binds: PurchaseInvoice.base_in_words
    validation: read only (computed or filled by the program)
  - label: Rounding Adjustment
    control: money
    binds: PurchaseInvoice.base_rounding_adjustment
    validation: read only (computed or filled by the program); shown only when eval:!doc.disable_rounded_total
  - label: Rounded Total
    control: money
    binds: PurchaseInvoice.base_rounded_total
    validation: read only (computed or filled by the program); shown only when eval:!doc.disable_rounded_total
  - label: Total Advance
    control: money
    binds: PurchaseInvoice.total_advance
    validation: read only (computed or filled by the program)
  - label: Outstanding Amount
    control: money
    binds: PurchaseInvoice.outstanding_amount
    validation: read only (computed or filled by the program)
  - label: Tax Withholding Group
    control: lookup
    binds: PurchaseInvoice.tax_withholding_group
    validation: chosen among Tax Withholding Group records
  - label: Ignore Tax Withholding Threshold
    control: checkbox
    binds: PurchaseInvoice.ignore_tax_withholding_threshold
