    binds: PurchaseInvoice.additional_discount_percentage
  - label: Additional Discount Amount
    control: money
    binds: PurchaseInvoice.discount_amount
  - label: Taxes and Charges Calculation
    control: text
    binds: PurchaseInvoice.other_charges_calculation
    validation: read only (computed or filled by the program)
  - label: Item Wise Tax Details
    control: grid
    columns:
      - Item Row
      - Tax Row
      - Tax Rate
      - Tax Amount
      - Taxable Amount
  - label: Pricing Rule Detail
    control: grid
    validation: read only (computed or filled by the program)
    columns:
      - Pricing Rule
      - Item Code
  - label: Supplied Items
    control: grid
    validation: shown only when update_stock
    columns:
      - Item Code
      - Raw Material Item Code
      - BOM Detail No
      - Reference Name
      - Available Qty For Consumption
      - Qty to Be Consumed
      - Current Stock
  - label: Mode of Payment
    control: lookup
    binds: PurchaseInvoice.mode_of_payment
    validation: chosen among Mode of Payment records
