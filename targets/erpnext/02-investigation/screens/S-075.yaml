  - label: Cash/Bank Account
    control: lookup
    binds: PurchaseInvoice.cash_bank_account
    validation: chosen among Account records
  - label: Paid Amount
    control: money
    binds: PurchaseInvoice.paid_amount
    validation: shown only when is_paid
  - label: Set Advances and Allocate (FIFO)
    control: checkbox
    binds: PurchaseInvoice.allocate_advances_automatically
  - label: Only Include Allocated Payments
    control: checkbox
    binds: PurchaseInvoice.only_include_allocated_payments
    validation: shown only when allocate_advances_automatically
  - label: Advances
    control: grid
    columns:
      - Reference Name
      - Remarks
      - Advance Amount
      - Allocated Amount
      - Difference Posting Date
  - label: Write Off Amount
    control: money
    binds: PurchaseInvoice.write_off_amount
  - label: Write Off Amount (Company Currency)
    control: money
    binds: PurchaseInvoice.base_write_off_amount
    validation: read only (computed or filled by the program)
  - label: Write Off Account
    control: lookup
    binds: PurchaseInvoice.write_off_account
    validation: shown only when eval:flt(doc.write_off_amount)!=0; chosen among Account records
  - label: Write Off Cost Center
    control: lookup
    binds: PurchaseInvoice.write_off_cost_center
    validation: shown only when eval:flt(doc.write_off_amount)!=0; chosen among Cost Center records
