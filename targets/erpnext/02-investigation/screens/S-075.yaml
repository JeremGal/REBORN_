  - label: Apply Additional Discount On
    control: select
    binds: PurchaseInvoice.apply_discount_on
  - label: Additional Discount Amount (Company Currency)
    control: money
    binds: PurchaseInvoice.base_discount_amount
    validation: read only (computed or filled by the program)
  - label: Additional Discount Percentage
