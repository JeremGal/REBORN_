id: S-075
title: Purchase Invoice
purpose: create, view and edit Purchase Invoice records
kind: form
layout: "tabs: Payments, Address & Contact, Terms, More Info, Connections; sections: Supplier Invoice, Accounting Dimensions , Currency and Price List, Items, Taxes and Charges, Totals, Totals (Company Currency), Tax Withholding Entry, Additional Discount, Tax Breakup, Pricing Rules, Raw Materials Supplied, Payments, Advance Payments, Write Off, Supplier Address, Shipping Address, Company Billing Address, Payment Terms, Terms and Conditions, Status, Accounting Details, Subscription, Automation, Print Settings, ...; 135 fields"
fields:
  - label: Series
    control: select
    binds: PurchaseInvoice.naming_series
    required: true
  - label: Supplier
    control: lookup
    binds: PurchaseInvoice.supplier
    required: true
    validation: chosen among Supplier records
  - label: Supplier Name
    control: text
    binds: PurchaseInvoice.supplier_name
    validation: read only (computed or filled by the program); shown only when supplier
  - label: Tax Id
    control: display
    binds: PurchaseInvoice.tax_id
    validation: read only (computed or filled by the program)
  - label: Company
    control: lookup
    binds: PurchaseInvoice.company
    validation: chosen among Company records
  - label: Posting Date
    control: date
    binds: PurchaseInvoice.posting_date
    required: true
  - label: Posting Time
    control: date
    binds: PurchaseInvoice.posting_time
  - label: Edit Posting Date and Time
    control: checkbox
    binds: PurchaseInvoice.set_posting_time
    validation: shown only when eval:doc.docstatus==0
  - label: Due Date
    control: date
    binds: PurchaseInvoice.due_date
  - label: Is Paid
    control: checkbox
    binds: PurchaseInvoice.is_paid
  - label: Is Return (Debit Note)
    control: checkbox
    binds: PurchaseInvoice.is_return
  - label: Return Against Purchase Invoice
    control: lookup
    binds: PurchaseInvoice.return_against
    validation: read only (computed or filled by the program); shown only when return_against; chosen among Purchase Invoice records
  - label: Update Outstanding for Self
    control: checkbox
    binds: PurchaseInvoice.update_outstanding_for_self
    validation: "shown only when eval: doc.is_return && doc.return_against"
  - label: Update Billed Amount in Purchase Order
    control: checkbox
    binds: PurchaseInvoice.update_billed_amount_in_purchase_order
    validation: "shown only when eval: doc.is_return"
  - label: Update Billed Amount in Purchase Receipt
    control: checkbox
    binds: PurchaseInvoice.update_billed_amount_in_purchase_receipt
    validation: "shown only when eval: doc.is_return"
  - label: Consider for Tax Withholding
    control: checkbox
    binds: PurchaseInvoice.apply_tds
  - label: Amended From
    control: lookup
    binds: PurchaseInvoice.amended_from
    validation: read only (computed or filled by the program); chosen among Purchase Invoice records
  - label: Supplier Invoice No
    control: text
    binds: PurchaseInvoice.bill_no
  - label: Supplier Invoice Date
    control: date
    binds: PurchaseInvoice.bill_date
  - label: Cost Center
    control: lookup
    binds: PurchaseInvoice.cost_center
    validation: chosen among Cost Center records
  - label: Project
    control: lookup
    binds: PurchaseInvoice.project
    validation: chosen among Project records
  - label: Currency
    control: lookup
    binds: PurchaseInvoice.currency
    validation: chosen among Currency records
  - label: Exchange Rate
    control: number
    binds: PurchaseInvoice.conversion_rate
  - label: Use Transaction Date Exchange Rate
    control: checkbox
    binds: PurchaseInvoice.use_transaction_date_exchange_rate
    validation: read only (computed or filled by the program)
  - label: Price List
    control: lookup
    binds: PurchaseInvoice.buying_price_list
    validation: chosen among Price List records
  - label: Price List Currency
    control: lookup
    binds: PurchaseInvoice.price_list_currency
    validation: read only (computed or filled by the program); chosen among Currency records
  - label: Price List Exchange Rate
    control: number
    binds: PurchaseInvoice.plc_conversion_rate
  - label: Ignore Pricing Rule
    control: checkbox
    binds: PurchaseInvoice.ignore_pricing_rule
  - label: Scan Barcode
    control: text
    binds: PurchaseInvoice.scan_barcode
  - label: Last Scanned Warehouse
    control: text
    binds: PurchaseInvoice.last_scanned_warehouse
    validation: "shown only when eval: doc.last_scanned_warehouse"
  - label: Update Stock
    control: checkbox
    binds: PurchaseInvoice.update_stock
    validation: shown only when eval:doc.items.every((item) => !item.pr_detail)
  - label: Set Accepted Warehouse
    control: lookup
    binds: PurchaseInvoice.set_warehouse
    validation: shown only when update_stock; chosen among Warehouse records
  - label: Set From Warehouse
    control: lookup
    binds: PurchaseInvoice.set_from_warehouse
    validation: shown only when eval:doc.update_stock && doc.is_internal_supplier; chosen among Warehouse records
  - label: Is Subcontracted
    control: checkbox
    binds: PurchaseInvoice.is_subcontracted
    validation: read only (computed or filled by the program)
  - label: Rejected Warehouse
    control: lookup
    binds: PurchaseInvoice.rejected_warehouse
    validation: shown only when update_stock; chosen among Warehouse records
  - label: Supplier Warehouse
    control: lookup
    binds: PurchaseInvoice.supplier_warehouse
    validation: shown only when eval:doc.is_subcontracted; chosen among Warehouse records
  - label: Items
    control: grid
    required: true
    columns:
      - Item
      - Accepted Qty
      - Rate
      - Amount
  - label: Total Quantity
    control: number
    binds: PurchaseInvoice.total_qty
    validation: read only (computed or filled by the program)
  - label: Total Net Weight
    control: number
    binds: PurchaseInvoice.total_net_weight
    validation: read only (computed or filled by the program); shown only when total_net_weight
  - label: Total (Company Currency)
    control: money
    binds: PurchaseInvoice.base_total
    validation: read only (computed or filled by the program)
  - label: Net Total (Company Currency)
    control: money
    binds: PurchaseInvoice.base_net_total
    validation: read only (computed or filled by the program)
  - label: Claimed Landed Cost Amount (Company Currency)
    control: money
    binds: PurchaseInvoice.claimed_landed_cost_amount
    validation: read only (computed or filled by the program)
  - label: Total
    control: money
    binds: PurchaseInvoice.total
    validation: read only (computed or filled by the program)
  - label: Net Total
    control: money
    binds: PurchaseInvoice.net_total
    validation: read only (computed or filled by the program)
  - label: Tax Category
    control: lookup
    binds: PurchaseInvoice.tax_category
    validation: chosen among Tax Category records
  - label: Purchase Taxes and Charges Template
    control: lookup
    binds: PurchaseInvoice.taxes_and_charges
    validation: chosen among Purchase Taxes and Charges Template records
  - label: Shipping Rule
    control: lookup
    binds: PurchaseInvoice.shipping_rule
    validation: chosen among Shipping Rule records
  - label: Incoterm
    control: lookup
    binds: PurchaseInvoice.incoterm
    validation: chosen among Incoterm records
  - label: Named Place
    control: text
    binds: PurchaseInvoice.named_place
    validation: shown only when incoterm
  - label: Purchase Taxes and Charges
    control: grid
    columns:
      - Type
