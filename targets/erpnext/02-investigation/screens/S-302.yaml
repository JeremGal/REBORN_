id: S-302
title: Master Production Schedule
purpose: create, view and edit Master Production Schedule records
kind: form
layout: "tabs: Planning, Demand; sections: Open Orders, Actual Demand, Forecast Demand; 12 fields"
fields:
  - label: Naming Series
    control: select
    binds: MasterProductionSchedule.naming_series
    required: true
  - label: Company
    control: lookup
    binds: MasterProductionSchedule.company
    required: true
    validation: chosen among Company records
  - label: Posting Date
    control: date
    binds: MasterProductionSchedule.posting_date
    required: true
  - label: From Date
    control: date
    binds: MasterProductionSchedule.from_date
    required: true
  - label: To Date
    control: date
    binds: MasterProductionSchedule.to_date
  - label: Select Items
    control: grid
    columns:
      - Item Code
      - Delivery Date
      - Lead Time
      - Start Date
      - Planned Qty
      - BOM No
  - label: Parent Warehouse
    control: lookup
    binds: MasterProductionSchedule.parent_warehouse
    validation: chosen among Warehouse records
  - label: Sales Orders
    control: grid
    columns:
      - Sales Order
      - Sales Order Date
      - Customer
      - Grand Total
      - Status
  - label: Material Requests
    control: grid
    columns:
      - Material Request
      - Material Request Date
  - label: Items
    control: grid
    columns:
      - Item Code
      - Delivery Date
      - Lead Time
      - Start Date
      - Planned Qty
      - BOM No
  - label: Sales Forecast
    control: lookup
    binds: MasterProductionSchedule.sales_forecast
    validation: chosen among Sales Forecast records
  - label: Amended From
    control: lookup
    binds: MasterProductionSchedule.amended_from
    validation: read only (computed or filled by the program); chosen among Master Production Schedule records
actions:
  - label: Save
    triggers: F-303
status: confirmed
evidence:
