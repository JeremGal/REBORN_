id: S-433
title: Service Level Agreement
purpose: create, view and edit Service Level Agreement records
kind: form
layout: "sections: Assignment Conditions, Valid From, Response and Resolution, Status Details, Working Hours; 16 fields; observed labels differ from the declared form (5/11 match; not declared: nom, client, priorité, service demandé, temps de première réponse, temps de résolution)"
fields:
  - label: Apply On
    control: lookup
    binds: ServiceLevelAgreement.document_type
