id: S-174
title: Report
purpose: create, view and edit Report records
kind: form
layout: "sections: Filters, Columns, Query / Script, Client Code; 23 fields"
fields:
  - label: Report Name
    control: text
    binds: Report.report_name
    required: true
  - label: Ref DocType
    control: lookup
    binds: Report.ref_doctype
    required: true
    validation: chosen among DocType records
  - label: Reference Report
    control: text
    binds: Report.reference_report
  - label: Is Standard
    control: select
    binds: Report.is_standard
    required: true
  - label: Module
    control: lookup
    binds: Report.module
    validation: chosen among Module Def records
  - label: Documentation URL
    control: text
    binds: Report.documentation_url
  - label: Report Type
    control: select
    binds: Report.report_type
    required: true
  - label: Letter Head
    control: lookup
    binds: Report.letter_head
    validation: 'shown only when eval: doc.is_standard == "No"; chosen among Letter Head records'
  - label: Add Total Row
    control: checkbox
    binds: Report.add_total_row
    validation: 'shown only when eval: doc.report_type !== "Report Builder"'
  - label: Disabled
    control: checkbox
    binds: Report.disabled
  - label: Prepared Report
    control: checkbox
    binds: Report.prepared_report
  - label: Snapshot Report
    control: checkbox
    binds: Report.snapshot_report
  - label: Disable Prepared Report Automation
    control: checkbox
    binds: Report.disable_prepared_report_automation
    validation: shown only when eval:doc.report_type === "Script Report"
  - label: Add Translate Data
    control: checkbox
    binds: Report.add_translate_data
  - label: Timeout (In Seconds)
    control: number
    binds: Report.timeout
    validation: shown only when prepared_report
  - label: Doctype To Sync
    control: grid
    validation: "shown only when eval: doc.snapshot_report"
    columns:
      - DocType
  - label: Filters
    control: grid
    validation: shown only when eval:!["Custom Report", "Report Builder"].includes(doc.report_type)
    columns:
      - Label
      - Fieldtype
      - Fieldname
      - Mandatory
      - Options
  - label: Columns
    control: grid
    validation: shown only when eval:!["Custom Report", "Report Builder"].includes(doc.report_type)
    columns:
      - Fieldname
      - Label
      - Fieldtype
  - label: Query
    control: text
    binds: Report.query
    validation: shown only when eval:doc.report_type=="Query Report"
  - label: Script
    control: text
    binds: Report.report_script
    validation: shown only when eval:doc.report_type==="Script Report" && doc.is_standard==="No"
  - label: Javascript
    control: text
    binds: Report.javascript
    validation: shown only when eval:doc.report_type=="Script Report" && doc.is_standard==="No"
  - label: JSON
    control: text
    binds: Report.json
    validation: read only (computed or filled by the program); shown only when eval:doc.report_type=="Report Builder" || "Custom Report"
  - label: Roles
    control: grid
    columns:
      - Role
actions:
  - label: Save
    triggers: F-175
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Report
    note: declared by the program
