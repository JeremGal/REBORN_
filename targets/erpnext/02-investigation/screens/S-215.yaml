    control: checkbox
    binds: CustomField.print_hide_if_no_value
    validation: shown only when eval:["Int", "Float", "Currency", "Percent"].indexOf(doc.fieldtype)!==-1
  - label: Print Width
    control: text
    binds: CustomField.print_width
  - label: Alignment
    control: select
    binds: CustomField.alignment
    validation: shown only when eval:['Data', 'Int', 'Float', 'Currency', 'Percent'].includes(doc.fieldtype)
  - label: No Copy
    control: checkbox
    binds: CustomField.no_copy
  - label: Set only once
    control: checkbox
    binds: CustomField.set_only_once
  - label: Remember Last Selected Value
    control: checkbox
    binds: CustomField.remember_last_selected_value
    validation: shown only when eval:(doc.fieldtype == 'Link')
  - label: Allow on Submit
    control: checkbox
    binds: CustomField.allow_on_submit
  - label: In List View
    control: checkbox
    binds: CustomField.in_list_view
  - label: In Standard Filter
    control: checkbox
    binds: CustomField.in_standard_filter
  - label: In Global Search
    control: checkbox
    binds: CustomField.in_global_search
    validation: shown only when eval:(["Data", "Select", "Table", "Text", "Text Editor", "Link", "Small Text", "
  - label: In Preview
    control: checkbox
    binds: CustomField.in_preview
    validation: shown only when eval:!in_list(['Table', 'Table MultiSelect'], doc.fieldtype);
  - label: Bold
    control: checkbox
    binds: CustomField.bold
  - label: Report Hide
    control: checkbox
    binds: CustomField.report_hide
  - label: Include in Import Template
    control: checkbox
    binds: CustomField.in_import_template
    validation: shown only when eval:doc.fieldtype !== 'Attachment Gallery'
  - label: Index
    control: checkbox
    binds: CustomField.search_index
  - label: Allow in Quick Entry
    control: checkbox
    binds: CustomField.allow_in_quick_entry
  - label: Allow Bulk Edit
    control: checkbox
    binds: CustomField.allow_bulk_edit
    validation: 'shown only when eval: doc.fieldtype == "Table"'
  - label: Ignore XSS Filter
    control: checkbox
    binds: CustomField.ignore_xss_filter
  - label: Translatable
    control: checkbox
    binds: CustomField.translatable
    validation: shown only when eval:['Data', 'Select', 'Text', 'Small Text', 'Text Editor'].includes(doc.fieldt
  - label: Hide Border
    control: checkbox
    binds: CustomField.hide_border
    validation: shown only when eval:doc.fieldtype=='Section Break'
  - label: Show Dashboard
    control: checkbox
    binds: CustomField.show_dashboard
  - label: Field Description
    control: text
    binds: CustomField.description
  - label: Permission Level
    control: number
    binds: CustomField.permlevel
  - label: Width
    control: text
    binds: CustomField.width
  - label: Columns
    control: number
    binds: CustomField.columns
actions:
  - label: Save
    triggers: F-216
