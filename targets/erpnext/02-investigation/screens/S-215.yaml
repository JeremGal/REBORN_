id: S-215
title: Custom Field
purpose: create, view and edit Custom Field records
kind: form
layout: 58 fields
fields:
  - label: Is System Generated
    control: checkbox
    binds: CustomField.is_system_generated
    validation: read only (computed or filled by the program)
  - label: DocType
    control: lookup
    binds: CustomField.dt
    required: true
    validation: chosen among DocType records
  - label: Module (for export)
    control: lookup
    binds: CustomField.module
    validation: chosen among Module Def records
  - label: Label
    control: text
    binds: CustomField.label
  - label: Placeholder
    control: text
    binds: CustomField.placeholder
  - label: Fieldname
    control: text
    binds: CustomField.fieldname
    validation: read only (computed or filled by the program)
  - label: Insert After
    control: select
    binds: CustomField.insert_after
  - label: Length
    control: number
    binds: CustomField.length
    validation: shown only when eval:in_list(['Data', 'Link', 'Dynamic Link', 'Password', 'Select', 'Read Only',
  - label: Filters
    control: other
    binds: CustomField.link_filters
    validation: shown only when eval:["Attachment Gallery", "Link"].includes(doc.fieldtype)
  - label: Field Type
    control: select
    binds: CustomField.fieldtype
    required: true
  - label: Button Color
    control: select
    binds: CustomField.button_color
    validation: shown only when eval:doc.fieldtype==="Button"
  - label: Precision
    control: select
    binds: CustomField.precision
    validation: shown only when eval:in_list(["Float", "Currency", "Percent"], doc.fieldtype)
  - label: Hide Seconds
    control: checkbox
    binds: CustomField.hide_seconds
    validation: shown only when eval:doc.fieldtype=='Duration'
  - label: Hide Days
    control: checkbox
    binds: CustomField.hide_days
    validation: shown only when eval:doc.fieldtype=='Duration'
  - label: Options
    control: text
    binds: CustomField.options
  - label: Sort Options
    control: checkbox
    binds: CustomField.sort_options
    validation: "shown only when eval: doc.fieldtype === 'Select'"
  - label: Fetch From
    control: text
    binds: CustomField.fetch_from
  - label: Fetch on Save if Empty
    control: checkbox
    binds: CustomField.fetch_if_empty
  - label: Collapsible
    control: checkbox
    binds: CustomField.collapsible
    validation: shown only when eval:doc.fieldtype=="Section Break"
  - label: Collapsible Depends On
    control: text
    binds: CustomField.collapsible_depends_on
    validation: shown only when eval:doc.fieldtype=="Section Break"
  - label: Default Value
    control: text
    binds: CustomField.default
  - label: Depends On
    control: text
    binds: CustomField.depends_on
  - label: Mandatory Depends On
    control: text
    binds: CustomField.mandatory_depends_on
  - label: Read Only Depends On
    control: text
    binds: CustomField.read_only_depends_on
  - label: Non Negative
    control: checkbox
    binds: CustomField.non_negative
    validation: shown only when eval:in_list(["Int", "Float", "Currency"], doc.fieldtype)
  - label: Is Mandatory Field
    control: checkbox
    binds: CustomField.reqd
  - label: Unique
    control: checkbox
    binds: CustomField.unique
  - label: Is Virtual
    control: checkbox
    binds: CustomField.is_virtual
    validation: shown only when eval:doc.fieldtype !== 'Link'
  - label: Read Only
    control: checkbox
    binds: CustomField.read_only
  - label: Mask
    control: checkbox
    binds: CustomField.mask
    validation: shown only when eval:["Select", "Read Only", "Phone", "Percent", "Password", "Link", "Int", "Flo
  - label: Ignore User Permissions
    control: checkbox
    binds: CustomField.ignore_user_permissions
    validation: shown only when eval:doc.fieldtype==="Link"
  - label: Hidden
    control: checkbox
    binds: CustomField.hidden
  - label: Print Hide
    control: checkbox
    binds: CustomField.print_hide
