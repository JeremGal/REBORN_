id: S-078
title: Repost Payment Ledger
purpose: create, view and edit Repost Payment Ledger records
kind: form
layout: "sections: Filters, Status, Vouchers; 8 fields"
fields:
  - label: Company
    control: lookup
    binds: RepostPaymentLedger.company
    required: true
    validation: chosen among Company records
  - label: Posting Date
    control: date
    binds: RepostPaymentLedger.posting_date
    required: true
  - label: Voucher Type
    control: lookup
    binds: RepostPaymentLedger.voucher_type
    validation: chosen among DocType records
  - label: Add Manually
    control: checkbox
    binds: RepostPaymentLedger.add_manually
  - label: Repost Status
    control: select
    binds: RepostPaymentLedger.repost_status
    validation: read only (computed or filled by the program)
  - label: Repost Error Log
    control: text
    binds: RepostPaymentLedger.repost_error_log
    validation: shown only when eval:doc.repost_error_log
  - label: Selected Vouchers
    control: grid
    columns: []
  - label: Amended From
    control: lookup
    binds: RepostPaymentLedger.amended_from
    validation: read only (computed or filled by the program); chosen among Repost Payment Ledger records
actions:
  - label: Save
    triggers: F-079
  - label: Submit
    triggers: F-079
  - label: Cancel
    triggers: F-079
  - label: Amend
    triggers: F-079
