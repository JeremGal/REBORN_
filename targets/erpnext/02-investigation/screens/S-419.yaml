id: S-419
title: Stock Reconciliation
purpose: create, view and edit Stock Reconciliation records
kind: form
layout: "sections: Accounting Dimensions; 16 fields; observed labels differ from the declared form (10/21 match; not declared: no., code de l'article, entrepôt, quantité, udm du stock, taux de valorisation, ajouter une ligne, télécharger)"
fields:
  - label: Series
    control: select
    binds: StockReconciliation.naming_series
    required: true
  - label: Company
    control: lookup
    binds: StockReconciliation.company
    required: true
    validation: chosen among Company records
  - label: Purpose
    control: select
    binds: StockReconciliation.purpose
    required: true
  - label: Made from Stock Valuation Comparison
    control: checkbox
    binds: StockReconciliation.is_made_from_valuation_comparison
    validation: read only (computed or filled by the program)
  - label: Posting Date
    control: date
    binds: StockReconciliation.posting_date
    required: true
  - label: Posting Time
    control: date
    binds: StockReconciliation.posting_time
    required: true
  - label: Edit Posting Date and Time
    control: checkbox
    binds: StockReconciliation.set_posting_time
  - label: Default Warehouse
    control: lookup
    binds: StockReconciliation.set_warehouse
    validation: chosen among Warehouse records
  - label: Scan Barcode
    control: text
    binds: StockReconciliation.scan_barcode
  - label: Last Scanned Warehouse
    control: text
    binds: StockReconciliation.last_scanned_warehouse
    validation: "shown only when eval: doc.last_scanned_warehouse"
  - label: Scan Mode
    control: checkbox
    binds: StockReconciliation.scan_mode
  - label: Items
    control: grid
    required: true
    columns:
      - Item Code
      - Warehouse
      - Quantity
      - Stock UOM
      - Valuation Rate
  - label: Difference Account
    control: lookup
    binds: StockReconciliation.expense_account
    validation: chosen among Account records
  - label: Difference Amount
    control: money
    binds: StockReconciliation.difference_amount
    validation: read only (computed or filled by the program)
  - label: Amended From
    control: lookup
    binds: StockReconciliation.amended_from
    validation: read only (computed or filled by the program); chosen among Stock Reconciliation records
  - label: Cost Center
    control: lookup
    binds: StockReconciliation.cost_center
    validation: chosen among Cost Center records
actions:
  - label: Save
    triggers: F-420
  - label: Submit
    triggers: F-420
  - label: Cancel
    triggers: F-420
  - label: Amend
    triggers: F-420
status: partial
