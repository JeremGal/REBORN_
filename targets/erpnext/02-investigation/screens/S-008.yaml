id: S-008
title: Advance Payment Ledger Entry
purpose: create, view and edit Advance Payment Ledger Entry records
kind: form
layout: 11 fields
fields:
  - label: Company
    control: lookup
    binds: AdvancePaymentLedgerEntry.company
    validation: read only (computed or filled by the program); chosen among Company records
  - label: Voucher Type
    control: lookup
    binds: AdvancePaymentLedgerEntry.voucher_type
    validation: read only (computed or filled by the program); chosen among DocType records
  - label: Voucher No
    control: lookup
    binds: AdvancePaymentLedgerEntry.voucher_no
    validation: read only (computed or filled by the program)
  - label: Against Voucher Type
    control: lookup
    binds: AdvancePaymentLedgerEntry.against_voucher_type
    validation: read only (computed or filled by the program); chosen among DocType records
  - label: Against Voucher No
    control: lookup
    binds: AdvancePaymentLedgerEntry.against_voucher_no
    validation: read only (computed or filled by the program)
  - label: Currency
    control: lookup
    binds: AdvancePaymentLedgerEntry.currency
    validation: read only (computed or filled by the program); chosen among Currency records
  - label: Exchange Rate
    control: number
    binds: AdvancePaymentLedgerEntry.exchange_rate
    validation: read only (computed or filled by the program); shown only when exchange_rate
  - label: Amount
    control: money
    binds: AdvancePaymentLedgerEntry.amount
    validation: read only (computed or filled by the program)
  - label: Amount (Company Currency)
    control: money
    binds: AdvancePaymentLedgerEntry.base_amount
    validation: read only (computed or filled by the program); shown only when base_amount
  - label: Event
    control: text
    binds: AdvancePaymentLedgerEntry.event
    validation: read only (computed or filled by the program)
  - label: DeLinked
    control: checkbox
    binds: AdvancePaymentLedgerEntry.delinked
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-009
