id: S-247
title: Sidebar
purpose: create, view and edit Sidebar records
kind: form
layout: "sections: Items; 7 fields"
fields:
  - label: Title
    control: text
    binds: Sidebar.title
    required: true
  - label: Module
    control: lookup
    binds: Sidebar.module
    validation: chosen among Module Def records
  - label: Header Icon
    control: other
    binds: Sidebar.header_icon
  - label: App
    control: text
    binds: Sidebar.app
  - label: Items
    control: grid
    columns:
      - Label
      - Link Type
      - Icon
      - Type
      - Link To
      - Child Item
  - label: Standard
    control: checkbox
    binds: Sidebar.standard
    validation: read only (computed or filled by the program)
  - label: Merged From
    control: text
    binds: Sidebar.merged_from
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-248
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Sidebar
    note: declared by the program
