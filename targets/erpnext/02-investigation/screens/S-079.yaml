id: S-079
title: Sales Invoice
purpose: create, view and edit Sales Invoice records
kind: form
layout: "tabs: Payments, Address & Contact, Terms, More Info, Connections; sections: Accounting Dimensions, Currency and Price List, Items, Taxes and Charges, Totals, Totals (Company Currency), Tax Withholding Entry, Additional Discount, Tax Breakup, Pricing Rules, Packing List, Time Sheet List, Payments, Changes, Advance Payments, Write Off, Loyalty Points Redemption, Billing Address, Shipping Address, Company Address, Payment Terms, Terms and Conditions, Customer PO Details, Accounting Details, Commission, ...; 155 fields; observed labels differ from the declared form (22/41 match; not declared: no., item, quantité, prix usd, montant usd, entrepôt, ajouter une ligne, ajouter plusieurs)"
fields:
