id: S-415
title: Stock Closing Entry
purpose: create, view and edit Stock Closing Entry records
kind: form
layout: 6 fields
fields:
  - label: Naming Series
    control: select
    binds: StockClosingEntry.naming_series
  - label: Company
    control: lookup
    binds: StockClosingEntry.company
    required: true
    validation: chosen among Company records
  - label: Status
    control: select
    binds: StockClosingEntry.status
    validation: read only (computed or filled by the program)
  - label: From Date
    control: date
    binds: StockClosingEntry.from_date
    validation: read only (computed or filled by the program)
  - label: To Date
    control: date
    binds: StockClosingEntry.to_date
    required: true
  - label: Amended From
    control: lookup
    binds: StockClosingEntry.amended_from
    validation: read only (computed or filled by the program); chosen among Stock Closing Entry records
actions:
  - label: Save
    triggers: F-416
  - label: Submit
    triggers: F-416
  - label: Cancel
    triggers: F-416
  - label: Amend
    triggers: F-416
status: partial
