id: S-204
title: Contract Template
purpose: create, view and edit Contract Template records
kind: form
layout: 4 fields
fields:
  - label: Title
    control: text
    binds: ContractTemplate.title
  - label: Contract Terms and Conditions
    control: text
    binds: ContractTemplate.contract_terms
  - label: Requires Fulfilment
    control: checkbox
    binds: ContractTemplate.requires_fulfilment
  - label: Fulfilment Terms and Conditions
    control: grid
    validation: shown only when eval:doc.requires_fulfilment==1
    columns:
      - Requirement
actions:
  - label: Save
    triggers: F-205
status: partial
