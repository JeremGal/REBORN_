    control: grid
    required: true
    columns:
      - Item
      - Quantity
      - Rate
      - Amount
      - Warehouse
      - Serial No
  - label: Pricing Rule Detail
    control: grid
    validation: read only (computed or filled by the program)
    columns:
      - Pricing Rule
      - Item Code
  - label: Packed Items
    control: grid
    validation: shown only when packed_items
    columns:
