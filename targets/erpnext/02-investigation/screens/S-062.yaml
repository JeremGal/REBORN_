id: S-062
title: POS Invoice
purpose: create, view and edit POS Invoice records
kind: form
layout: "tabs: Payments, Address & Contact, Terms, More Info; sections: Accounting Dimensions, Currency and Price List, Warehouse, Items, Pricing Rules, Packing List, Time Sheet List, Tax Breakup, Additional Discount, Payments, Changes, Advance Payments, Write Off, Loyalty Points Redemption, Address and Contact, Payment Terms, Terms and Conditions, Customer PO Details, Printing Settings, UTM Analytics, More Information, Accounting Details, Commission, Sales Team, Subscription, ...; 126 fields"
fields:
  - label: Series
    control: select
    binds: POSInvoice.naming_series
    required: true
  - label: Customer
    control: lookup
    binds: POSInvoice.customer
    validation: chosen among Customer records
  - label: Customer Name
    control: text
    binds: POSInvoice.customer_name
    validation: read only (computed or filled by the program); shown only when customer
  - label: Tax Id
    control: text
    binds: POSInvoice.tax_id
    validation: read only (computed or filled by the program)
  - label: POS Profile
    control: lookup
    binds: POSInvoice.pos_profile
    validation: shown only when is_pos; chosen among POS Profile records
  - label: Consolidated Sales Invoice
    control: lookup
    binds: POSInvoice.consolidated_invoice
    validation: read only (computed or filled by the program); chosen among Sales Invoice records
  - label: Include Payment (POS)
    control: checkbox
    binds: POSInvoice.is_pos
    required: true
    validation: read only (computed or filled by the program)
  - label: Is Return (Credit Note)
    control: checkbox
    binds: POSInvoice.is_return
  - label: Update Billed Amount in Sales Order
    control: checkbox
    binds: POSInvoice.update_billed_amount_in_sales_order
    validation: "shown only when eval: doc.is_return && doc.return_against"
  - label: Update Billed Amount in Delivery Note
    control: checkbox
    binds: POSInvoice.update_billed_amount_in_delivery_note
    validation: "shown only when eval: doc.is_return && doc.return_against"
  - label: Company
    control: lookup
    binds: POSInvoice.company
    required: true
    validation: chosen among Company records
  - label: Date
    control: date
    binds: POSInvoice.posting_date
    required: true
  - label: Posting Time
    control: date
    binds: POSInvoice.posting_time
  - label: Edit Posting Date and Time
    control: checkbox
    binds: POSInvoice.set_posting_time
    validation: shown only when eval:doc.docstatus==0
  - label: Payment Due Date
    control: date
    binds: POSInvoice.due_date
  - label: Amended From
    control: lookup
    binds: POSInvoice.amended_from
    validation: read only (computed or filled by the program); chosen among POS Invoice records
  - label: Return Against
    control: lookup
    binds: POSInvoice.return_against
    validation: read only (computed or filled by the program); shown only when return_against; chosen among POS Invoice records
  - label: Project
    control: lookup
    binds: POSInvoice.project
    validation: chosen among Project records
  - label: Cost Center
    control: lookup
    binds: POSInvoice.cost_center
    validation: chosen among Cost Center records
  - label: Currency
    control: lookup
    binds: POSInvoice.currency
    required: true
    validation: chosen among Currency records
  - label: Exchange Rate
    control: number
    binds: POSInvoice.conversion_rate
    required: true
  - label: Price List
    control: lookup
    binds: POSInvoice.selling_price_list
    required: true
    validation: chosen among Price List records
