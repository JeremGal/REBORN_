id: S-299
title: Downtime Entry
purpose: create, view and edit Downtime Entry records
kind: form
layout: "sections: Downtime Reason; 8 fields"
fields:
  - label: Naming Series
    control: select
    binds: DowntimeEntry.naming_series
    required: true
  - label: Workstation / Machine
    control: lookup
    binds: DowntimeEntry.workstation
    required: true
    validation: chosen among Workstation records
  - label: Operator
    control: lookup
    binds: DowntimeEntry.operator
    required: true
    validation: chosen among Employee records
  - label: From Time
    control: date
    binds: DowntimeEntry.from_time
    required: true
  - label: To Time
    control: date
    binds: DowntimeEntry.to_time
    required: true
  - label: Downtime
    control: number
    binds: DowntimeEntry.downtime
    validation: read only (computed or filled by the program)
  - label: Stop Reason
    control: select
    binds: DowntimeEntry.stop_reason
    required: true
  - label: Remarks
    control: text
    binds: DowntimeEntry.remarks
actions:
  - label: Save
    triggers: F-300
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Downtime Entry
