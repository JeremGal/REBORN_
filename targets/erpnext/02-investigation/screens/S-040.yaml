id: S-040
title: Journal Entry
purpose: create, view and edit Journal Entry records
kind: form
layout: "tabs: Tax Withholding, More Info; sections: Periodic Accounting, Auto Repeat, Reference, Printing Settings, Write Off, Additional Info; 49 fields; observed labels differ from the declared form (9/19 match; not declared: multi-devis, no., compte, type de tiers, tiers, débit, crédit, ajouter une ligne)"
fields:
  - label: Company
    control: lookup
    binds: JournalEntry.company
    required: true
    validation: chosen among Company records
  - label: Entry Type
    control: select
    binds: JournalEntry.voucher_type
    required: true
  - label: Series
    control: select
    binds: JournalEntry.naming_series
    required: true
  - label: Posting Date
    control: date
    binds: JournalEntry.posting_date
    required: true
  - label: Multi Currency
    control: checkbox
    binds: JournalEntry.multi_currency
  - label: "Consider for Tax Withholding "
    control: checkbox
    binds: JournalEntry.apply_tds
    validation: shown only when eval:['Credit Note', 'Debit Note'].includes(doc.voucher_type)
  - label: Tax Withholding Category
    control: lookup
    binds: JournalEntry.tax_withholding_category
    validation: shown only when eval:doc.apply_tds; chosen among Tax Withholding Category records
  - label: Is System Generated
    control: checkbox
    binds: JournalEntry.is_system_generated
    validation: read only (computed or filled by the program); shown only when eval:doc.is_system_generated == 1;
  - label: Amended From
    control: lookup
    binds: JournalEntry.amended_from
    validation: read only (computed or filled by the program); chosen among Journal Entry records
  - label: For All Stock Asset Accounts
    control: checkbox
    binds: JournalEntry.for_all_stock_asset_accounts
  - label: Stock Asset Account
    control: lookup
    binds: JournalEntry.stock_asset_account
    validation: shown only when eval:doc.for_all_stock_asset_accounts === 0; chosen among Account records
  - label: Periodic Entry Difference Account
    control: lookup
    binds: JournalEntry.periodic_entry_difference_account
    validation: shown only when eval:doc.voucher_type === "Periodic Accounting Entry"; chosen among Account records
  - label: Accounting Entries
    control: grid
    required: true
    columns:
      - Account
      - Party Type
      - Party
      - Debit
      - Credit
  - label: Total Debit
    control: money
    binds: JournalEntry.total_debit
    validation: read only (computed or filled by the program)
  - label: Total Credit
    control: money
    binds: JournalEntry.total_credit
    validation: read only (computed or filled by the program)
  - label: Difference (Dr - Cr)
    control: money
    binds: JournalEntry.difference
    validation: read only (computed or filled by the program); shown only when difference
  - label: Reference Number
    control: text
    binds: JournalEntry.cheque_no
  - label: Reference Date
    control: date
    binds: JournalEntry.cheque_date
  - label: Clearance Date
    control: date
    binds: JournalEntry.clearance_date
    validation: read only (computed or filled by the program)
  - label: User Remark
    control: text
    binds: JournalEntry.user_remark
  - label: Auto Repeat
    control: lookup
    binds: JournalEntry.auto_repeat
    validation: read only (computed or filled by the program); chosen among Auto Repeat records
  - label: Tax Withholding Group
    control: lookup
    binds: JournalEntry.tax_withholding_group
    validation: chosen among Tax Withholding Group records
  - label: Ignore Tax Withholding Threshold
    control: checkbox
    binds: JournalEntry.ignore_tax_withholding_threshold
  - label: Edit Tax Withholding Entries
    control: checkbox
    binds: JournalEntry.override_tax_withholding_entries
  - label: Tax Withholding Entries
    control: grid
    columns:
      - Tax Withholding Category
      - Tax Withholding Group
      - Base Taxable Amount
      - Tax Rate
      - Base Tax Withheld
      - Taxable Document Name
  - label: Bill No
    control: text
    binds: JournalEntry.bill_no
  - label: Bill Date
    control: date
    binds: JournalEntry.bill_date
  - label: Due Date
    control: date
    binds: JournalEntry.due_date
  - label: Inter Company Journal Entry Reference
    control: lookup
    binds: JournalEntry.inter_company_journal_entry_reference
    validation: read only (computed or filled by the program); shown only when eval:doc.voucher_type== "Inter Company Journal Entry"; chosen among Journal Entry records
  - label: Process Deferred Accounting
    control: lookup
    binds: JournalEntry.process_deferred_accounting
    validation: read only (computed or filled by the program); chosen among Process Deferred Accounting records
  - label: Reversal Of
    control: lookup
    binds: JournalEntry.reversal_of
    validation: read only (computed or filled by the program); shown only when eval:doc.docstatus; chosen among Journal Entry records
  - label: Payment Order
    control: lookup
    binds: JournalEntry.payment_order
    validation: read only (computed or filled by the program); chosen among Payment Order records
  - label: Stock Entry
    control: lookup
    binds: JournalEntry.stock_entry
    validation: read only (computed or filled by the program); shown only when eval:in_list(["Credit Note", "Debit Note"], doc.voucher_type); chosen among Stock Entry records
  - label: Pay To / Recd From
    control: text
    binds: JournalEntry.pay_to_recd_from
  - label: Letter Head
    control: lookup
    binds: JournalEntry.letter_head
    validation: chosen among Letter Head records
  - label: Print Heading
    control: lookup
    binds: JournalEntry.select_print_heading
    validation: chosen among Print Heading records
  - label: Total Amount Currency
    control: lookup
    binds: JournalEntry.total_amount_currency
    validation: read only (computed or filled by the program); chosen among Currency records
  - label: Total Amount
    control: money
    binds: JournalEntry.total_amount
    validation: read only (computed or filled by the program)
  - label: Total Amount in Words
    control: text
    binds: JournalEntry.total_amount_in_words
    validation: read only (computed or filled by the program)
  - label: Write Off Based On
    control: select
    binds: JournalEntry.write_off_based_on
    validation: shown only when eval:doc.voucher_type == 'Write Off Entry'
  - label: Write Off Amount
    control: money
    binds: JournalEntry.write_off_amount
    validation: shown only when eval:doc.voucher_type == 'Write Off Entry'
  - label: Is Opening
    control: select
    binds: JournalEntry.is_opening
  - label: Finance Book
    control: lookup
    binds: JournalEntry.finance_book
    validation: read only (computed or filled by the program); chosen among Finance Book records
  - label: From Template
    control: lookup
    binds: JournalEntry.from_template
    validation: chosen among Journal Entry Template records
  - label: Title
    control: text
    binds: JournalEntry.title
  - label: Custom Remark
    control: checkbox
    binds: JournalEntry.custom_remark
  - label: Remark
    control: text
    binds: JournalEntry.remark
  - label: Mode of Payment
    control: lookup
    binds: JournalEntry.mode_of_payment
    validation: chosen among Mode of Payment records
  - label: Party Not Required
    control: checkbox
    binds: JournalEntry.party_not_required
actions:
  - label: Save
    triggers: F-041
  - label: Submit
    triggers: F-041
  - label: Cancel
    triggers: F-041
  - label: Amend
    triggers: F-041
status: partial
