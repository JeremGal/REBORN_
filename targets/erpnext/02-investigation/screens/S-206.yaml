id: S-206
title: Email Campaign
purpose: create, view and edit Email Campaign records
kind: form
layout: 7 fields
fields:
  - label: Campaign
    control: lookup
    binds: EmailCampaign.campaign_name
    required: true
    validation: chosen among Campaign records
  - label: "Email Campaign For "
    control: select
    binds: EmailCampaign.email_campaign_for
    required: true
  - label: Recipient
    control: lookup
    binds: EmailCampaign.recipient
    required: true
  - label: Sender
    control: lookup
    binds: EmailCampaign.sender
    validation: chosen among User records
  - label: Start Date
    control: date
    binds: EmailCampaign.start_date
    required: true
  - label: End Date
    control: date
    binds: EmailCampaign.end_date
    validation: read only (computed or filled by the program)
  - label: Status
    control: select
    binds: EmailCampaign.status
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-207
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Email Campaign
    note: declared by the program
