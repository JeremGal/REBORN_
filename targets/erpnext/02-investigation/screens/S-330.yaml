    control: text
    binds: NonConformance.full_name
    validation: read only (computed or filled by the program)
  - label: Status
    control: select
    binds: NonConformance.status
    required: true
  - label: Details
    control: text
    binds: NonConformance.details
  - label: Corrective Action
    control: text
    binds: NonConformance.corrective_action
  - label: Preventive Action
    control: text
    binds: NonConformance.preventive_action
actions:
  - label: Save
    triggers: F-331
status: partial
