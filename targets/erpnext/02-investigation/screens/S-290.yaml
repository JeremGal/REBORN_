id: S-290
title: Webhook
purpose: create, view and edit Webhook records
kind: form
layout: "sections: Doc Events, Webhook Trigger, Webhook Request, Webhook Security, Webhook Headers, Webhook Data; 15 fields"
fields:
  - label: DocType
    control: lookup
    binds: Webhook.webhook_doctype
    required: true
    validation: chosen among DocType records
  - label: Doc Event
    control: select
    binds: Webhook.webhook_docevent
  - label: Enabled
    control: checkbox
    binds: Webhook.enabled
  - label: Condition
    control: text
    binds: Webhook.condition
  - label: Request URL
    control: text
    binds: Webhook.request_url
    required: true
  - label: Is Dynamic URL?
    control: checkbox
    binds: Webhook.is_dynamic_url
  - label: Request Timeout
    control: number
    binds: Webhook.timeout
  - label: Background Jobs Queue
    control: text
    binds: Webhook.background_jobs_queue
  - label: Request Method
    control: select
    binds: Webhook.request_method
    required: true
  - label: Request Structure
    control: select
    binds: Webhook.request_structure
  - label: Enable Security
    control: checkbox
    binds: Webhook.enable_security
  - label: Webhook Secret
    control: text
    binds: Webhook.webhook_secret
    validation: shown only when eval:doc.enable_security == 1
  - label: Headers
    control: grid
    columns:
      - Key
      - Value
  - label: Data
    control: grid
    validation: 'shown only when eval: !doc.request_structure || doc.request_structure == "Form URL-Encoded"'
    columns:
      - Fieldname
      - Key
  - label: JSON Request Body
    control: text
    binds: Webhook.webhook_json
    validation: 'shown only when eval: doc.request_structure == "JSON"'
actions:
  - label: Save
    triggers: F-291
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Webhook
    note: declared by the program
