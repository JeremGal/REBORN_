id: S-064
title: POS Opening Entry
purpose: create, view and edit POS Opening Entry records
kind: form
layout: 11 fields
fields:
  - label: Period Start Date
    control: date
    binds: POSOpeningEntry.period_start_date
    required: true
  - label: Period End Date
    control: date
    binds: POSOpeningEntry.period_end_date
    validation: read only (computed or filled by the program)
  - label: Status
    control: select
    binds: POSOpeningEntry.status
    validation: read only (computed or filled by the program)
  - label: Posting Date
    control: date
    binds: POSOpeningEntry.posting_date
    required: true
  - label: Set Posting Date
    control: checkbox
    binds: POSOpeningEntry.set_posting_date
  - label: Company
    control: lookup
    binds: POSOpeningEntry.company
    required: true
    validation: chosen among Company records
  - label: POS Profile
    control: lookup
    binds: POSOpeningEntry.pos_profile
    required: true
    validation: chosen among POS Profile records
  - label: POS Closing Entry
    control: text
    binds: POSOpeningEntry.pos_closing_entry
    validation: read only (computed or filled by the program)
  - label: Cashier
    control: lookup
    binds: POSOpeningEntry.user
    required: true
    validation: chosen among User records
  - label: Opening Balance Details
    control: grid
    required: true
    columns:
      - Mode of Payment
      - Opening Amount
  - label: Amended From
    control: lookup
    binds: POSOpeningEntry.amended_from
    validation: read only (computed or filled by the program); chosen among POS Opening Entry records
actions:
  - label: Save
    triggers: F-065
  - label: Submit
    triggers: F-065
  - label: Cancel
    triggers: F-065
  - label: Amend
    triggers: F-065
status: partial
