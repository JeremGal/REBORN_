id: S-257
title: Common Code
purpose: create, view and edit Common Code records
kind: form
layout: 7 fields
fields:
  - label: Code List
    control: lookup
    binds: CommonCode.code_list
    required: true
    validation: chosen among Code List records
  - label: Canonical URI
    control: text
    binds: CommonCode.canonical_uri
  - label: Title
    control: text
    binds: CommonCode.title
    required: true
  - label: Common Code
    control: text
    binds: CommonCode.common_code
    required: true
  - label: Description
    control: text
    binds: CommonCode.description
  - label: Additional Data
    control: text
    binds: CommonCode.additional_data
    validation: read only (computed or filled by the program)
  - label: Applies To
    control: grid
    columns:
      - Link Document Type
      - Link Name
      - Link Title
actions:
  - label: Save
    triggers: F-258
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Common Code
    note: declared by the program
