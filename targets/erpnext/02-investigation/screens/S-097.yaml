id: S-097
title: Asset Depreciation Schedule
purpose: create, view and edit Asset Depreciation Schedule records
kind: form
layout: "sections: Depreciation Details, Depreciation Schedule, Details; 20 fields"
fields:
  - label: Asset
    control: lookup
    binds: AssetDepreciationSchedule.asset
    required: true
    validation: chosen among Asset records
  - label: Naming Series
    control: select
    binds: AssetDepreciationSchedule.naming_series
  - label: Company
    control: lookup
    binds: AssetDepreciationSchedule.company
    validation: read only (computed or filled by the program); chosen among Company records
  - label: Net Purchase Amount
    control: money
    binds: AssetDepreciationSchedule.net_purchase_amount
    validation: read only (computed or filled by the program)
  - label: Opening Accumulated Depreciation
    control: money
    binds: AssetDepreciationSchedule.opening_accumulated_depreciation
    validation: read only (computed or filled by the program)
  - label: Opening Number of Booked Depreciations
    control: number
    binds: AssetDepreciationSchedule.opening_number_of_booked_depreciations
    validation: read only (computed or filled by the program)
  - label: Finance Book
    control: lookup
    binds: AssetDepreciationSchedule.finance_book
    validation: chosen among Finance Book records
  - label: Finance Book Id
    control: number
    binds: AssetDepreciationSchedule.finance_book_id
    validation: read only (computed or filled by the program)
  - label: Depreciation Method
    control: select
    binds: AssetDepreciationSchedule.depreciation_method
    validation: read only (computed or filled by the program)
  - label: Total Number of Depreciations
    control: number
    binds: AssetDepreciationSchedule.total_number_of_depreciations
    validation: read only (computed or filled by the program); shown only when total_number_of_depreciations
  - label: Rate of Depreciation
    control: number
    binds: AssetDepreciationSchedule.rate_of_depreciation
    validation: read only (computed or filled by the program); shown only when eval:doc.depreciation_method == 'Written Down Value'
  - label: Depreciate based on daily pro-rata
    control: checkbox
    binds: AssetDepreciationSchedule.daily_prorata_based
    validation: read only (computed or filled by the program); shown only when eval:doc.depreciation_method == "Straight Line" || doc.depreciation_method == "M
  - label: Depreciate based on shifts
    control: checkbox
    binds: AssetDepreciationSchedule.shift_based
    validation: read only (computed or filled by the program); shown only when eval:doc.depreciation_method == "Straight Line"
  - label: Frequency of Depreciation (Months)
    control: number
    binds: AssetDepreciationSchedule.frequency_of_depreciation
    validation: read only (computed or filled by the program); shown only when frequency_of_depreciation
  - label: Expected Value After Useful Life
    control: money
    binds: AssetDepreciationSchedule.expected_value_after_useful_life
    validation: read only (computed or filled by the program)
  - label: Value After Depreciation
    control: money
    binds: AssetDepreciationSchedule.value_after_depreciation
    validation: read only (computed or filled by the program)
  - label: Depreciation Schedule
    control: grid
    columns:
      - Schedule Date
      - Depreciation Amount
      - Accumulated Depreciation Amount
      - Journal Entry
  - label: Notes
    control: text
    binds: AssetDepreciationSchedule.notes
    validation: read only (computed or filled by the program)
  - label: Status
    control: select
    binds: AssetDepreciationSchedule.status
    validation: read only (computed or filled by the program)
  - label: Amended From
    control: lookup
    binds: AssetDepreciationSchedule.amended_from
    validation: read only (computed or filled by the program); chosen among Asset Depreciation Schedule records
actions:
  - label: Save
    triggers: F-098
  - label: Submit
    triggers: F-098
  - label: Cancel
    triggers: F-098
  - label: Amend
    triggers: F-098
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Asset Depreciation Schedule
    note: declared by the program
