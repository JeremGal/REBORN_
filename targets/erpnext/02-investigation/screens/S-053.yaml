id: S-053
title: Payment Ledger Entry
purpose: create, view and edit Payment Ledger Entry records
kind: form
layout: 20 fields
fields:
  - label: Posting Date
    control: date
    binds: PaymentLedgerEntry.posting_date
  - label: Company
    control: lookup
    binds: PaymentLedgerEntry.company
    validation: chosen among Company records
  - label: Account Type
    control: select
    binds: PaymentLedgerEntry.account_type
  - label: Account
    control: lookup
    binds: PaymentLedgerEntry.account
    validation: chosen among Account records
  - label: Party Type
    control: lookup
    binds: PaymentLedgerEntry.party_type
    validation: chosen among DocType records
  - label: Party
    control: lookup
    binds: PaymentLedgerEntry.party
  - label: Due Date
    control: date
    binds: PaymentLedgerEntry.due_date
  - label: Voucher Detail No
    control: text
    binds: PaymentLedgerEntry.voucher_detail_no
  - label: Cost Center
    control: lookup
    binds: PaymentLedgerEntry.cost_center
    validation: chosen among Cost Center records
  - label: Finance Book
    control: lookup
    binds: PaymentLedgerEntry.finance_book
    validation: chosen among Finance Book records
  - label: Voucher Type
    control: lookup
    binds: PaymentLedgerEntry.voucher_type
    validation: chosen among DocType records
  - label: Voucher No
    control: lookup
    binds: PaymentLedgerEntry.voucher_no
  - label: Against Voucher Type
    control: lookup
    binds: PaymentLedgerEntry.against_voucher_type
    validation: chosen among DocType records
  - label: Against Voucher No
    control: lookup
    binds: PaymentLedgerEntry.against_voucher_no
  - label: Amount
    control: money
    binds: PaymentLedgerEntry.amount
  - label: Currency
    control: lookup
    binds: PaymentLedgerEntry.account_currency
    validation: chosen among Currency records
  - label: Amount in Account Currency
    control: money
    binds: PaymentLedgerEntry.amount_in_account_currency
  - label: DeLinked
    control: checkbox
    binds: PaymentLedgerEntry.delinked
  - label: Remarks
    control: text
    binds: PaymentLedgerEntry.remarks
  - label: Project
    control: lookup
    binds: PaymentLedgerEntry.project
    validation: chosen among Project records
actions:
  - label: Save
    triggers: F-054
status: partial
