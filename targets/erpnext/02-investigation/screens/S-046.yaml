id: S-046
title: Loyalty Program
purpose: create, view and edit Loyalty Program records
kind: form
layout: "sections: Collection Tier, Redemption, Accounting Dimensions, Help Section; 14 fields"
fields:
  - label: Loyalty Program Name
    control: text
    binds: LoyaltyProgram.loyalty_program_name
    required: true
  - label: Loyalty Program Type
    control: select
    binds: LoyaltyProgram.loyalty_program_type
  - label: From Date
    control: date
    binds: LoyaltyProgram.from_date
    required: true
  - label: To Date
    control: date
    binds: LoyaltyProgram.to_date
  - label: Customer Group
    control: lookup
    binds: LoyaltyProgram.customer_group
    validation: chosen among Customer Group records
  - label: Customer Territory
    control: lookup
    binds: LoyaltyProgram.customer_territory
    validation: chosen among Territory records
  - label: Auto Opt In (For all customers)
    control: checkbox
    binds: LoyaltyProgram.auto_opt_in
  - label: Collection Rules
    control: grid
    required: true
    columns:
      - Tier Name
      - Minimum Total Spent
      - Collection Factor (=1 LP)
  - label: Conversion Factor
    control: number
    binds: LoyaltyProgram.conversion_factor
  - label: Expiry Duration (in days)
    control: number
    binds: LoyaltyProgram.expiry_duration
  - label: Expense Account
    control: lookup
    binds: LoyaltyProgram.expense_account
    validation: chosen among Account records
  - label: Company
    control: lookup
    binds: LoyaltyProgram.company
    validation: chosen among Company records
  - label: Cost Center
    control: lookup
    binds: LoyaltyProgram.cost_center
    validation: chosen among Cost Center records
  - label: Project
    control: lookup
    binds: LoyaltyProgram.project
    validation: chosen among Project records
actions:
  - label: Save
    triggers: F-047
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Loyalty Program
    note: declared by the program
