id: S-320
title: Activity Cost
purpose: create, view and edit Activity Cost records
kind: form
layout: 7 fields
fields:
  - label: Activity Type
    control: lookup
    binds: ActivityCost.activity_type
    required: true
    validation: chosen among Activity Type records
  - label: Employee
    control: lookup
    binds: ActivityCost.employee
    validation: chosen among Employee records
  - label: Employee Name
    control: text
    binds: ActivityCost.employee_name
    validation: read only (computed or filled by the program)
  - label: Department
    control: lookup
    binds: ActivityCost.department
    validation: read only (computed or filled by the program); chosen among Department records
  - label: Billing Rate
    control: money
    binds: ActivityCost.billing_rate
  - label: Costing Rate
    control: money
    binds: ActivityCost.costing_rate
  - label: title
    control: text
    binds: ActivityCost.title
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-321
status: partial
