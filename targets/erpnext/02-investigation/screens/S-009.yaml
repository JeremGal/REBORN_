id: S-009
title: Bank
purpose: create, view and edit Bank records
kind: form
layout: "sections: Bank Details, Address and Contact, Data Import Configuration; 5 fields"
fields:
  - label: Bank Name
    control: text
    binds: Bank.bank_name
    required: true
  - label: SWIFT number
    control: text
    binds: Bank.swift_number
  - label: Website
    control: text
    binds: Bank.website
  - label: Bank Transaction Mapping
    control: grid
    columns:
      - Field in Bank Transaction
      - Column in Bank File
  - label: Plaid Access Token
    control: text
    binds: Bank.plaid_access_token
    validation: read only (computed or filled by the program)
actions:
  - label: Save
    triggers: F-010
status: partial
