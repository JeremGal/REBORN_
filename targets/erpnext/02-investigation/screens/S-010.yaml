    control: lookup
    binds: BankAccount.account_subtype
    validation: chosen among Bank Account Subtype records
  - label: Disabled
    control: checkbox
    binds: BankAccount.disabled
  - label: Is Default Account
    control: checkbox
    binds: BankAccount.is_default
  - label: Is Company Account
    control: checkbox
    binds: BankAccount.is_company_account
  - label: Company
    control: lookup
    binds: BankAccount.company
    validation: shown only when is_company_account; chosen among Company records
  - label: Is Credit Card
    control: checkbox
    binds: BankAccount.is_credit_card
  - label: Party Type
    control: lookup
    binds: BankAccount.party_type
    validation: chosen among DocType records
  - label: Party
    control: lookup
    binds: BankAccount.party
  - label: IBAN
    control: text
    binds: BankAccount.iban
