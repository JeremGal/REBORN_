id: S-334
title: Quality Goal
purpose: create, view and edit Quality Goal records
kind: form
layout: "sections: Objectives; 6 fields"
fields:
  - label: Goal
    control: text
    binds: QualityGoal.goal
    required: true
  - label: Monitoring Frequency
    control: select
    binds: QualityGoal.frequency
  - label: Procedure
    control: lookup
    binds: QualityGoal.procedure
    validation: chosen among Quality Procedure records
  - label: Weekday
    control: select
    binds: QualityGoal.weekday
    validation: shown only when eval:doc.frequency == 'Weekly';
  - label: Date
    control: select
    binds: QualityGoal.date
    validation: shown only when eval:doc.frequency == 'Monthly' || doc.frequency == 'Quarterly';
  - label: Objectives
    control: grid
    columns:
      - Objective
      - Target
      - UOM
actions:
  - label: Save
    triggers: F-335
status: partial
evidence:
  - ref: rb_c973157dea4f00b30694d174ba60bd8e1c0dd2943e41724155e07f10833e4cd8
    kind: rea
    locator: form layout of Quality Goal
    note: declared by the program
