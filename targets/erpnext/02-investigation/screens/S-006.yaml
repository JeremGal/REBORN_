id: S-006
title: Accounting Period
purpose: create, view and edit Accounting Period records
kind: form
layout: 7 fields
fields:
  - label: Period Name
    control: text
    binds: AccountingPeriod.period_name
    required: true
  - label: Start Date
    control: date
    binds: AccountingPeriod.start_date
    required: true
  - label: End Date
    control: date
    binds: AccountingPeriod.end_date
    required: true
  - label: Company
    control: lookup
    binds: AccountingPeriod.company
    required: true
    validation: chosen among Company records
  - label: Disabled
    control: checkbox
    binds: AccountingPeriod.disabled
  - label: Exempted Role
    control: lookup
    binds: AccountingPeriod.exempted_role
    validation: chosen among Role records
  - label: Closed Documents
    control: grid
    required: true
    columns:
      - Document Type
      - Closed
actions:
  - label: Save
    triggers: F-007
status: confirmed
