id: S-225
title: Dashboard
purpose: create, view and edit Dashboard records
kind: form
layout: 7 fields
fields:
  - label: Dashboard Name
    control: text
    binds: Dashboard.dashboard_name
    required: true
  - label: Is Default
    control: checkbox
    binds: Dashboard.is_default
  - label: Is Standard
    control: checkbox
    binds: Dashboard.is_standard
  - label: Module
    control: lookup
    binds: Dashboard.module
    validation: "shown only when eval: doc.is_standard; chosen among Module Def records"
  - label: Charts
    control: grid
    required: true
    columns:
      - Chart
      - Width
  - label: Chart Options
    control: text
    binds: Dashboard.chart_options
  - label: Cards
    control: grid
    columns:
      - Card
actions:
  - label: Save
    triggers: F-226
status: partial
evidence:
