id: M-004
title: Save a draft of every business document with only its mandatory fields
goal: >-
  For every business document type (accounting, selling, buying, stock, CRM, projects, manufacturing, assets, quality,
  support, maintenance, subcontracting, setup), save a draft with only the mandatory fields filled with fictitious
  values, and record what the program does: stored, or refused with its message. Never submit. Never touch documents
  that change the configuration of the site.
