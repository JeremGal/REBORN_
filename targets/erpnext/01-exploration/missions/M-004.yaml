steps_hint:
  - drafts only; list everything created so it can be deleted
capture:
  screenshots: key-steps
  read_values: [stored or refused, message shown]
  network: false
success_criteria:
  - every business document type has a recorded outcome
requested_by: block 2 (behaviour coverage)
