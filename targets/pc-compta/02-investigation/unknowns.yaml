    prediction: Entries are keyed per journal and folio, one line per account movement, with a running balance check before validation.
  - id: U-002
    question: How is data stored (file format, tables, types)?
    why: the data model is inferred from the technical sheet; without the real files, types/keys are unknown and no migration can be written.
    blocks: []
    probe:
      kind: manual
      suggestion: "Observe the evaluation version's data folder structure (file names/extensions only, no decompilation)."
