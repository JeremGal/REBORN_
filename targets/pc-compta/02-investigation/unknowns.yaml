    question: Exact rounding and the maximum amounts behaviour.
    why: the sheet gives caps (99 999 999 999,99 DA per entry) but not the rounding rule for tax/totals.
    probe:
      kind: h-mission
      suggestion: "Enter amounts with centimes and read back totals and any tax line."
      mission: M-003
    status: open
    evidence:
      - { ref: "doc:f89df11c9fd39e7e", kind: manual, locator: "SAISIE: amount caps" }
    severity: major
    required_basis:
      - runtime
      - documentation
    prediction: Amounts are kept to 2 decimals with rounding half up, and a maximum amount per entry exists.
    refuted_if: A halfway amount rounds down or to even.
