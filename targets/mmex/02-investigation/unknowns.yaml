# Open questions. A probe of kind h-mission becomes a block 1 mission with: node tools/reborn.mjs ask <target>
target: mmex
unknowns:
  - id: U-001
    question: Which tables, fields and relations does the bookkeeping database contain?
    why: >-
      Entity cards (domain/*.yaml) and every computation rule depend on the data model. The portable build ships mmexini.db3 as an empty file (0 bytes): the application creates its databases on first run, so there is nothing to read yet.
    probe:
      kind: h-mission
      suggestion: >-
        Start the portable application, create a new database in a scratch folder, then create one bank account, one payee, one category and two transactions (one deposit, one withdrawal) with fake data. Close the application and report the full path of the database file it created.
      mission: M-002
    status: open
    evidence:
      - ref: ev_c1678be0b290158188d40641501c7a5f3b052e2942bb7d6f2b058effbcbe7b20
        kind: rea
        locator: normalized_result.artifact.bytes = 0, schema.tables = []
        note: inspect-sqlite-database on mmexini.db3
      - ref: ev_e28b18949330c901d378e4ef60b4cdcccec3a1d47e36fd19d7d51206c7af15d7
        kind: rea
        note: inspect-desktop-application on the install folder
  - id: U-002
    question: Which screens, dialogs and menus does the application have?
    why: >-
      mmex.exe carries 68 Win32 resources (33 icons, 10 cursors, 10 icon groups, 10 cursor groups, 2 bitmaps, 1 menu, 1 version, 1 manifest) but no DIALOG template and no STRING table: the windows are built by code at runtime (wxWidgets), so the screen inventory cannot come from resources.
    probe:
      kind: h-mission
      suggestion: Run the kickoff tour (open every menu entry, screenshot each window, close without saving).
      mission: M-001
    status: open
    evidence:
      - ref: ev_fc719235bbbc3f7d43c2b37ddfa418658c93ae8045a11c69bf7cb6b44a97ee92
        kind: rea
        locator: normalized_result.resources (68 entries, type ids 1, 2, 3, 4, 12, 14, 16, 24)
        note: inspect-pe-resources on mmex.exe
