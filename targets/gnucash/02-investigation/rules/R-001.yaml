id: R-001
title: A transaction must balance (double entry)
kind: validation
statement: >-
  The splits of a transaction must sum to zero in the transaction currency. If they do not, the engine
  reports an imbalance and completes the entry with a balancing split to an "Imbalance" account rather than
  storing an unbalanced transaction.
formula: |
  sum(split.value_num / split.value_denom for split in transaction.splits) == 0
  if not balanced: add split to account "Imbalance-<CUR>" for the negated difference
applies_to: [Transaction, Split.value_num, Split.value_denom]
features: [F-001]
examples: []   # MISSING: needs an observed run (e.g. a 100.00 debit vs 100.00 credit) to become a test; block 1 mission raised
