id: R-001
title: Ticket line and ticket totals
kind: computation
statement: >-
  A ticket line's base is units times unit price. Its tax is the base times the line's tax rate, and its total
  is the base times one plus the rate. The ticket subtotal is the sum of line bases, the ticket tax is the sum of
  the taxes grouped per rate, and the ticket total is subtotal plus tax. Each line references one tax.
formula: |
  line_base   = units * unit_price
  line_tax    = line_base * rate
  line_total  = line_base * (1 + rate)
  subtotal    = sum(line_base)
  ticket_tax  = sum(line_tax)                          # stored per rate in the tax lines (base, amount)
  ticket_total = subtotal + ticket_tax
applies_to: [Ticketlines.units, Ticketlines.price, Taxes.rate, Taxlines.base, Taxlines.amount]
features: [F-001]
examples: []   # a run gives the worked example; rounding is R-003, compound taxes are R-004
