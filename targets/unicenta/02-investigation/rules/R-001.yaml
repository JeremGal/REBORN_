id: R-001
title: Ticket line and ticket totals
kind: computation
statement: >-
  A ticket line total is units times unit price. The ticket total is the sum of its line totals plus the tax
  computed per tax rate. Each line references one tax (TICKETLINES.TAXID -> TAXES.RATE).
formula: |
  line_base  = TICKETLINES.UNITS * TICKETLINES.PRICE
  line_tax   = line_base * TAXES.RATE                 # per line's tax
  ticket_base = sum(line_base)
  ticket_tax  = sum(line_tax)                          # stored per rate in TAXLINES (BASE, AMOUNT)
  ticket_total = ticket_base + ticket_tax
applies_to: [Ticketlines.units, Ticketlines.price, Taxes.rate, Taxlines.base, Taxlines.amount]
features: [F-001]
examples: []   # rounding and compound-tax (RATECASCADE) behaviour to confirm by a run (block 1)
