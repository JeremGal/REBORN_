id: R-004
title: Order and compounding of several taxes
kind: tax
statement: >-
  When a line carries several taxes, they are applied in their configured application order. A tax marked as
  cascading is computed on the running base, which already includes the taxes applied before it; a tax that is not
  cascading is computed on the original base.
formula: |
  base = line_base
  for tax in taxes ordered by application_order:
    if tax.cascade: amount = base * tax.rate          # base already includes earlier taxes
    else:           amount = line_base * tax.rate
    base = base + amount
applies_to: [Taxes.rate, Taxes.ratecascade, Taxes.rateorder]
features: [F-001]
examples: []   # a run with two cascading taxes shows the order and the compounding
status: confirmed
confidence: medium
evidence:
