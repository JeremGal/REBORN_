id: R-002
title: Payment and change
kind: computation
statement: >-
  A ticket is settled by one or more payments (cash, card, ...). The total paid must cover the ticket total;
  for cash, the change is the tendered amount minus the ticket total.
formula: |
  paid = sum(PAYMENTS.TOTAL for the receipt)
  change = tendered_cash - ticket_total        # cash only
  settled when paid >= ticket_total
applies_to: [Payments.total]
features: [F-001]
examples: []   # confirm change rounding and split-payment behaviour by a run
status: partial
confidence: medium
