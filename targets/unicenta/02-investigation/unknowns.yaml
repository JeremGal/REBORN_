# Open questions. ui_steps make these runnable by a computer-use agent: node tools/reborn.mjs ask <target>
target: unicenta
unknowns:
  - id: U-001
    question: What does the sale screen look like and what are the exact totals/change for a known ticket?
    why: F-001's acceptance AC-001 has no expected values; R-001/R-002 rounding is unconfirmed; the Swing screen is not captured.
    blocks: [ F-001 ]
    probe:
      kind: h-mission
      suggestion: "Open uniCenta, open a cash session, add 3 units of a 10.00 product taxed at 20%, tender 40.00 cash, read back base/tax/total/change and screenshot the sale screen."
      mission: M-002
    status: open
    evidence:
      - { ref: "sql:6ae1364b7d43e617", kind: rea, locator: "data model only; no runtime values", note: "shipped schema" }
    severity: blocking
    required_basis:
      - runtime
    prediction: "For 3 units at 10.00 with a 20% tax and 40.00 tendered: base 30.00, tax 6.00, total 36.00, change 4.00."
    refuted_if: Any of the four values differs, or the tax is computed on the rounded line.
  - id: U-002
    question: What do the STATUS / TICKETTYPE integer codes mean? (The compound-tax order is now described by R-004 from the code; a run gives its worked example.)
    why: the schema stores the codes as integers without labels; a rebuild needs the meanings.
    probe:
      kind: h-mission
      suggestion: "Create a normal sale, a refund and a layaway; note how TICKETTYPE/STATUS differ. Configure two cascading taxes and observe the order."
      mission: M-003
    status: open
    evidence:
      - { ref: "sql:6ae1364b7d43e617", kind: rea, locator: "TICKETS.TICKETTYPE, TICKETS.STATUS, TAXES.RATECASCADE/RATEORDER", note: "codes without labels" }
    severity: major
    required_basis:
      - runtime
      - static-code
    prediction: The ticket type distinguishes a normal sale from a refund; the status distinguishes open, closed and voided tickets.
    refuted_if: The codes carry other meanings, for example a layaway type.
    searched: The shipped schema stores both as integers without labels.
